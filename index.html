<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Лесорубы — дуэль</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#111820;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

/* =========================================================================
   ЛЕСОРУБЫ — дуэль на одном экране
   Один файл, без сборки и внешних зависимостей.
   Разделы: ПАЛИТРА · КОНСТАНТЫ · СОСТОЯНИЕ · ЗВУК · ГЕНЕРАЦИЯ ДЕРЕВА ·
            РАЗМЕТКА · ВВОД · ЛОГИКА · БОТ · ОТРИСОВКА · ЦИКЛ
   ========================================================================= */


/* =========================================================================
   1. ПАЛИТРА  — всё, что красится, живёт здесь.
      Арт следующего этапа меняет цвета тут и тела draw*-функций ниже.
   ========================================================================= */
const PALETTE = {
  // Чёрная обводка — основа стиля, ею обводится каждый объект.
  outline:     '#141210',

  // Небо зоны: светлое, иначе чёрная обводка не читается.
  // Обе зоны красятся одинаково, чтобы в «стопке» не было видно шва.
  zoneSkyTop:  '#a6ebf5',
  zoneSkyLow:  '#c8f4f8',
  divider:     '#141210',

  ground:      '#5ec93c',
  groundDark:  '#46ab2a',

  // Ветка красится этим же цветом — отдельной константы у неё нет.
  trunk:       '#a06a3e',

  leaf:        '#5ec93a',
  leafDot:     '#ffc63d',

  skin:        '#f7d3a6',
  hair:        '#3a2a1d',
  shirt:       '#ea5348',
  pants:       '#3f5f8f',
  boots:       '#2c2620',
  axeHandle:   '#c08b4a',
  axeBlade:    '#eef3f7',

  chip:        '#c9853d',
  chipDark:    '#8f5a26',

  text:        '#1d1a16',
  textDim:     '#5d6b63',
  white:       '#ffffff',
  accent:      '#ffc63d',
  danger:      '#e8443a',

  btn:         '#ffffff',
  btnHi:       '#ffc63d',

  flash:       '#ffffff',
  stunTint:    '#ff4a3d'
};


/* =========================================================================
   2. КОНСТАНТЫ
   ========================================================================= */
const WIN_SCORE    = 50;      // очков до победы
const STUN_TIME    = 0.7;     // сек. ошеломления
const TRUNK_TWEEN  = 0.08;    // сек. плавного опускания ствола
const SHAKE_TIME   = 0.12;    // сек. тряски зоны от удара
const SHAKE_MAG    = 3.5;     // px тряски от удара
const STUN_SHAKE_T = 0.30;    // сек. тряски от ошеломления
const STUN_SHAKE   = 8.0;     // px тряски от ошеломления
const RED_TIME     = 0.25;    // сек. красной заливки зоны на промахе
const TAP_FLASH    = 0.10;    // сек. подсветки половины зоны под пальцем

const DEG = Math.PI / 180;

/* --- Спрайты персонажа: размеры и точки привязки (доли, не пиксели) --- */
const SPRITE_H     = 0.22;    // высота персонажа — доля высоты зоны
const SPRITE_GAP   = 0.25;    // отступ от ствола — доля ширины спрайта
const AXE_LEN      = 0.62;    // длина топора — доля высоты персонажа
const HAND_PT      = { x: 0.85, y: 0.53 };  // кисть на спрайте персонажа
const AXE_PIVOT    = { x: 0.03, y: 0.28 };  // торец рукояти на спрайте топора
const AXE_EDGE     = { x: 0.86, y: 0.80 };  // лезвие — отсюда летят щепки

/* --- Анимация удара --- */
const CHOP_WINDUP_T = 0.06;   // сек. замаха
const CHOP_STRIKE_T = 0.05;   // сек. удара
const CHOP_RETURN_T = 0.12;   // сек. возврата
const AXE_WINDUP_A  = -45 * DEG;   // угол замаха
const AXE_STRIKE_A  =  25 * DEG;   // угол в момент контакта
const BODY_LEAN_A   =   6 * DEG;   // наклон корпуса вперёд на ударе

/* --- Промах --- */
const MISS_KNOCK_PX = 15;     // px отлёта от ствола
const MISS_KNOCK_T  = 0.20;   // сек. отлёта и возврата
const MISS_TILT_A   = 12 * DEG;    // наклон спрайта назад

// Полная анимация удара и момент контакта лезвия со стволом.
const CHOP_TIME  = CHOP_WINDUP_T + CHOP_STRIKE_T + CHOP_RETURN_T;
const CHOP_HIT_T = CHOP_WINDUP_T + CHOP_STRIKE_T;
const BRANCH_CHANCE= 0.35;    // вероятность ветки на новом сегменте
const MAX_SAME_RUN = 2;       // не больше двух веток подряд с одной стороны
const SAFE_START   = 3;       // первые сегменты — всегда без веток
const MIN_TRUNK    = 14;      // минимум сегментов в памяти (дополняется под экран)
const CD_STEPS     = 3;       // «3 · 2 · 1» перед боем
const CD_STEP_TIME = 0.55;    // сек. на цифру
const GO_TIME      = 0.45;    // сек. надписи «РУБИ!»
const STEP         = 1 / 120; // фиксированный шаг логики

const NONE = 'NONE', LEFT = 'LEFT', RIGHT = 'RIGHT';

// Уровни сложности бота: интервал удара сжимается по мере набора очков.
const DIFFICULTY = [
  { id:'easy',   name:'Легко',     start:0.78, min:0.42, err:0.20 },
  { id:'normal', name:'Нормально', start:0.55, min:0.26, err:0.12 },
  { id:'hard',   name:'Сложно',    start:0.42, min:0.19, err:0.06 }
];


/* =========================================================================
   3. СОСТОЯНИЕ
   ========================================================================= */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d', { alpha:false });

let W = 0, H = 0, DPR = 1;          // размеры в CSS-пикселях
let L = {};                          // вычисленная разметка (см. computeLayout)

let scene   = 'menu';                // 'menu' | 'difficulty' | 'play' | 'over'
let mode    = 'bot';                 // 'bot' | 'duo'
let diff    = DIFFICULTY[1];
let winner  = null;
let clock   = 0;                     // общее время, для колебаний
let countdown = 0;                   // отсчёт перед стартом
let goFlash = 0;                     // таймер надписи «РУБИ!»
let buttons = [];                    // активные кнопки текущей сцены

function makePlayer(index, isBot) {
  return {
    index, isBot,
    name: isBot ? 'Бот' : (index === 0 ? 'Игрок 1' : 'Игрок 2'),
    segments: [],        // [0] — нижний сегмент, { branch: NONE|LEFT|RIGHT }
    score: 0,
    side: LEFT,          // с какой стороны ствола стоит персонаж
    chop: 0,             // таймер анимации удара
    stun: 0,             // таймер ошеломления
    trunkAnim: 0,        // 1 → 0, твин опускания ствола
    shake: 0, shakeDur: SHAKE_TIME, shakeMag: 0,
    flash: 0,            // белая вспышка удара
    red: 0,              // красная заливка зоны на промахе
    knock: 0,            // отлёт персонажа назад на промахе
    tapFlash: 0,         // подсветка половины зоны под пальцем
    tapSide: LEFT,       // какую половину подсветить
    sprite: index === 0 ? 'red' : 'blue',   // какой спрайт лесоруба
    chipPending: false,  // щепки ждут момента контакта лезвия
    scorePop: 0,         // pop-анимация счётчика
    particles: [],
    botTimer: 0
  };
}
let players = [makePlayer(0, false), makePlayer(1, true)];


/* =========================================================================
   3b. СПРАЙТЫ — грузятся асинхронно. Пока их нет (или если файлы не
   отдались), персонаж рисуется примитивами, игра не ломается.
   ========================================================================= */
const Sprites = (function () {
  const src = {
    red:  'assets/lumberjack-red.png',
    blue: 'assets/lumberjack-blue.png',
    axe:  'assets/axe.png'
  };
  const img = {};
  for (const k in src) { img[k] = new Image(); img[k].src = src[k]; }

  const done = im => im && im.complete && im.naturalWidth > 0;
  return {
    get: k => (done(img[k]) ? img[k] : null),
    // Персонажа рисуем спрайтами только когда готовы и фигура, и топор.
    ready: k => done(img[k]) && done(img.axe)
  };
})();


/* =========================================================================
   4. ЗВУК — Web Audio API, все тона генерируются на лету.
   ========================================================================= */
const Sound = (function () {
  let ac = null, master = null, noiseBuf = null, ok = true;

  function ensure() {
    if (ac || !ok) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { ok = false; return; }
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.45;
    master.connect(ac.destination);

    const len = Math.floor(ac.sampleRate * 0.4);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  function unlock() {
    ensure();
    if (ac && ac.state === 'suspended') ac.resume();
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    ensure(); if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function noise(dur, vol, freq, q) {
    ensure(); if (!ac) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }

  return {
    unlock,
    chop(pitch) {
      noise(0.09, 0.32, 1700, 0.9);
      tone(150 + pitch * 40, 0.085, 'square', 0.16, 70);
    },
    stun() {
      // Промах должен звучать как удар: низкий тон плюс глухой «бум».
      tone(130, 0.38, 'sawtooth', 0.30, 38);
      tone( 70, 0.26, 'sine',     0.34, 34);
      noise(0.20, 0.22, 200, 0.6);
    },
    tap()  { tone(520, 0.06, 'triangle', 0.14, 720); },
    tick() { tone(440, 0.09, 'triangle', 0.16); },
    go()   { tone(880, 0.18, 'triangle', 0.20); },
    win() {
      [523, 659, 784, 1046].forEach((f, i) =>
        tone(f, 0.16, 'triangle', 0.20, null, i * 0.09));
    }
  };
})();


/* =========================================================================
   5. ГЕНЕРАЦИЯ ДЕРЕВА
   ========================================================================= */
function nextSegment(segs) {
  if (Math.random() >= BRANCH_CHANCE) return { branch: NONE };

  let side = Math.random() < 0.5 ? LEFT : RIGHT;

  // Не больше MAX_SAME_RUN веток подряд с одной стороны.
  let run = 0;
  for (let i = segs.length - 1; i >= 0 && segs[i].branch === side; i--) run++;
  if (run >= MAX_SAME_RUN) side = (side === LEFT ? RIGHT : LEFT);

  return { branch: side };
}

function trunkLength() {
  return Math.max(MIN_TRUNK, (L.visible || 10) + 2);
}

function buildTrunk() {
  const segs = [];
  const n = trunkLength();
  for (let i = 0; i < n; i++) {
    segs.push(i < SAFE_START ? { branch: NONE } : nextSegment(segs));
  }
  return segs;
}

/** После смены ориентации ствол может «не доставать» до верха — дорастим. */
function ensureTrunk(p) {
  const n = trunkLength();
  while (p.segments.length < n) p.segments.push(nextSegment(p.segments));
}


/* =========================================================================
   6. РАЗМЕТКА И МАСШТАБИРОВАНИЕ ХОЛСТА
   ========================================================================= */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeLayout();
}

/*
 * Две раскладки зон:
 *  - «стопка» (телефон, экран выше, чем шире): зоны друг над другом, верхняя
 *    развёрнута на 180° — игроки садятся с двух сторон телефона, и каждому
 *    достаётся вся ширина экрана под тап;
 *  - «рядом» (ПК и альбомная): зоны слева и справа, как раньше.
 */
function computeLayout() {
  const stacked = H >= W;
  const zw = stacked ? W : W / 2;
  const zh = stacked ? H / 2 : H;

  const ground = Math.max(28, Math.min(zh * 0.13, 84));
  const baseY  = zh - ground;                      // линия земли внутри зоны
  const segH   = Math.max(20, Math.min(zw * 0.26, (baseY - zh * 0.10) / 6));
  // Панель счёта компактная — она вспомогательная, поле важнее.
  const scoreSize = Math.round(Math.min(zw * 0.22, zh * 0.13, 68) / 1.5);

  // Толщина чёрной обводки — 4–6 px, чуть тянется за размером сегмента.
  const line = Math.max(4, Math.min(segH * 0.11, 6));

  // В «стопке» зона широкая, а высота сегмента задана по вертикали —
  // делаем ствол толще, иначе он теряется на широком экране.
  const trunkW = segH * (stacked ? 1.15 : 0.92);

  // Ветка — самый заметный объект: толстая «рука» и крупная крона.
  // Крона приплюснута: по высоте она должна укладываться в один сегмент,
  // иначе кроны соседних веток слипаются и не видно, где какая.
  let branchLen = segH * 1.00;
  let leafR     = segH * 0.52;
  const maxReach = zw * 0.47 - trunkW / 2;
  // 2.38 = вынос центра кроны (0.45) плюс её полуширина с гребнем волны,
  // всё в долях leafR.
  const reach    = branchLen + leafR * 2.19;
  if (reach > maxReach) {
    const k = maxReach / reach;
    branchLen *= k;
    leafR     *= k;
  }

  L = {
    stacked,
    zw, zh,
    ground,
    baseY,
    segH,
    line,
    trunkW,
    branchLen,
    leafR,
    // Крона — приплюснутый овал. Соседние кроны могут слегка находить
    // друг на друга: у каждой своя обводка, и они читаются как две.
    crownRx: leafR * 1.35,
    crownRy: leafR * 1.02,
    // Персонаж: высота — доля высоты зоны (см. SPRITE_H).
    charH: zh * SPRITE_H,
    scoreSize,
    nameSize: Math.max(11, Math.round(scoreSize * 0.38)),
    visible: Math.ceil(baseY / segH) + 1
  };
  if (players) for (const p of players) if (p.segments.length) ensureTrunk(p);
}

/** Положение зоны игрока на экране и нужен ли ей разворот на 180°. */
function zoneRect(p) {
  if (L.stacked) {
    return p.index === 0
      ? { x: 0, y: L.zh, rot: false }   // игрок 1 — снизу, как обычно
      : { x: 0, y: 0,    rot: true  };  // игрок 2 — сверху, вверх ногами
  }
  return { x: p.index * L.zw, y: 0, rot: false };
}

/** Выполняет fn в локальных координатах зоны (0..L.zw, 0..L.zh) с обрезкой. */
function withZone(p, fn) {
  const r = zoneRect(p);
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, L.zw, L.zh);
  ctx.clip();
  ctx.translate(r.x, r.y);
  if (r.rot) { ctx.translate(L.zw, L.zh); ctx.rotate(Math.PI); }
  fn();
  ctx.restore();
}


/* =========================================================================
   7. ВВОД — только touchstart/pointerdown, без задержек click
   ========================================================================= */
/** В чью зону попал тап. */
function playerAt(x, y) {
  if (L.stacked) return y < L.zh ? players[1] : players[0];
  return players[x < L.zw ? 0 : 1];
}

/**
 * Сторона удара в системе координат самого игрока: для верхней зоны экран
 * развёрнут, поэтому физически левый край для неё — правый.
 */
function sideOfTap(p, x, y) {
  const r = zoneRect(p);
  let lx = x - r.x;
  if (r.rot) lx = L.zw - lx;
  return lx < L.zw / 2 ? LEFT : RIGHT;
}

function onPoint(x, y) {
  Sound.unlock();

  if (scene === 'play') {
    const p = playerAt(x, y);
    if (p.isBot) return;
    chopAttempt(p, sideOfTap(p, x, y));
    return;
  }

  for (const b of buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      Sound.tap();
      b.action();
      return;
    }
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    onPoint(t.clientX, t.clientY);
  }
}, { passive:false });

canvas.addEventListener('touchmove',  e => e.preventDefault(), { passive:false });
canvas.addEventListener('touchend',   e => e.preventDefault(), { passive:false });

// Мышь — для проверки на десктопе.
canvas.addEventListener('mousedown', e => { e.preventDefault(); onPoint(e.clientX, e.clientY); });

// Клавиатура — тоже для десктопа: A/D — левый игрок, ←/→ — правый.
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  Sound.unlock();
  if (scene !== 'play') {
    if (e.key === 'Enter' || e.key === ' ') { if (buttons[0]) buttons[0].action(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'a') chopAttempt(players[0], LEFT);
  else if (k === 'd') chopAttempt(players[0], RIGHT);
  else if (e.key === 'ArrowLeft')  chopAttempt(players[1], LEFT);
  else if (e.key === 'ArrowRight') chopAttempt(players[1], RIGHT);
});

// Гасим зум по двойному тапу, жесты и контекстное меню.
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('dblclick',    e => e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(n =>
  window.addEventListener(n, e => e.preventDefault(), { passive:false }));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));


/* =========================================================================
   8. ЛОГИКА
   ========================================================================= */
function startGame(newMode) {
  mode = newMode;
  players = [makePlayer(0, false), makePlayer(1, newMode === 'bot')];
  if (newMode === 'duo') players[1].name = 'Игрок 2';
  for (const p of players) {
    p.segments = buildTrunk();
    p.botTimer = diff.start;
  }
  winner = null;
  countdown = CD_STEPS * CD_STEP_TIME;
  goFlash = 0;
  scene = 'play';
}

function chopAttempt(p, side) {
  if (scene !== 'play' || countdown > 0) return;

  // Подсветка половины зоны — отклик на само касание, до всех проверок,
  // чтобы игрок видел выбранную сторону даже когда тап пропал впустую.
  if (!p.isBot) { p.tapFlash = TAP_FLASH; p.tapSide = side; }

  if (p.stun > 0) return;                     // ошеломлён — тапы игнорируются

  p.side = side;
  p.chop = CHOP_TIME;

  const bottom = p.segments[0];
  if (bottom.branch === side) {
    // Попал по ветке — промах: зона краснеет, персонажа отбрасывает.
    p.stun = STUN_TIME;
    p.shake = STUN_SHAKE_T; p.shakeDur = STUN_SHAKE_T; p.shakeMag = STUN_SHAKE;
    p.red = 1;
    p.knock = MISS_KNOCK_T;
    spawnLeaves(p, side);
    Sound.stun();
    return;
  }

  // Чистый удар: нижний сегмент уходит, ствол опускается, сверху новый.
  p.segments.shift();
  p.segments.push(nextSegment(p.segments));
  p.trunkAnim = 1;
  p.score++;
  p.scorePop = 1;
  p.shake = SHAKE_TIME; p.shakeDur = SHAKE_TIME; p.shakeMag = SHAKE_MAG;
  p.flash = 1;
  p.chipPending = true;        // щепки полетят в момент контакта лезвия
  Sound.chop(p.score / WIN_SCORE);

  if (p.score >= WIN_SCORE) {
    winner = p;
    scene = 'over';
    Sound.win();
  }
}

function spawnChips(p, side) {
  const dir = side === LEFT ? -1 : 1;          // наружу от ствола, в сторону удара
  const pt = bladePoint(p, L.zw / 2);          // из точки касания лезвия со стволом
  const x = pt.x, y = pt.y;
  for (let i = 0; i < 12; i++) {
    p.particles.push({
      x, y,
      vx: dir * (60 + Math.random() * 220) + (Math.random() - 0.5) * 80,
      vy: -(120 + Math.random() * 220),
      g: 900,
      life: 0.45 + Math.random() * 0.35,
      max: 0.8,
      size: 3 + Math.random() * 4,
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 18,
      color: Math.random() < 0.5 ? PALETTE.chip : PALETTE.chipDark
    });
  }
}

function spawnLeaves(p, side) {
  const dir = side === LEFT ? -1 : 1;
  const x = L.zw / 2 + dir * L.trunkW * 0.6;
  const y = L.baseY - L.segH * 0.6;
  for (let i = 0; i < 10; i++) {
    p.particles.push({
      x, y,
      vx: dir * (30 + Math.random() * 140),
      vy: -(60 + Math.random() * 180),
      g: 620,
      life: 0.5 + Math.random() * 0.4,
      max: 0.9,
      size: 4 + Math.random() * 5,
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 12,
      color: Math.random() < 0.5 ? PALETTE.leaf : PALETTE.leafDot
    });
  }
}

function update(dt) {
  clock += dt;

  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt);

  if (scene === 'play' && countdown > 0) {
    const before = Math.ceil(countdown / CD_STEP_TIME);
    countdown -= dt;
    if (countdown < 0) countdown = 0;
    const after = Math.ceil(countdown / CD_STEP_TIME);
    if (after !== before) {
      if (after > 0) Sound.tick();
      else { Sound.go(); goFlash = GO_TIME; }
    }
  }

  for (const p of players) {
    if (p.chop > 0)      p.chop = Math.max(0, p.chop - dt);
    // Щепки — ровно в момент контакта лезвия со стволом.
    if (p.chipPending && CHOP_TIME - p.chop >= CHOP_HIT_T) {
      p.chipPending = false;
      spawnChips(p, p.side);
    }
    if (p.stun > 0)      p.stun = Math.max(0, p.stun - dt);
    if (p.shake > 0)     p.shake = Math.max(0, p.shake - dt);
    if (p.flash > 0)     p.flash = Math.max(0, p.flash - dt * 7);
    if (p.red > 0)       p.red = Math.max(0, p.red - dt / RED_TIME);
    if (p.knock > 0)     p.knock = Math.max(0, p.knock - dt);
    if (p.tapFlash > 0)  p.tapFlash = Math.max(0, p.tapFlash - dt);
    if (p.scorePop > 0)  p.scorePop = Math.max(0, p.scorePop - dt * 5);
    if (p.trunkAnim > 0) p.trunkAnim = Math.max(0, p.trunkAnim - dt / TRUNK_TWEEN);

    for (let i = p.particles.length - 1; i >= 0; i--) {
      const q = p.particles[i];
      q.life -= dt;
      if (q.life <= 0) { p.particles.splice(i, 1); continue; }
      q.vy += q.g * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.rot += q.spin * dt;
    }

    if (p.isBot && scene === 'play' && countdown === 0) updateBot(p, dt);
  }
}


/* =========================================================================
   9. БОТ — интервал сжимается по ходу партии, иногда бьёт по ветке.
   ========================================================================= */
function botInterval(p) {
  const t = Math.min(1, p.score / WIN_SCORE);
  return diff.start + (diff.min - diff.start) * t;
}

function updateBot(p, dt) {
  if (p.stun > 0) { p.botTimer = botInterval(p) * 0.6; return; }

  p.botTimer -= dt;
  if (p.botTimer > 0) return;
  p.botTimer = botInterval(p) * (0.85 + Math.random() * 0.3);

  const branch = p.segments[0].branch;
  const safe = branch === LEFT ? RIGHT : (branch === RIGHT ? LEFT
              : (Math.random() < 0.5 ? LEFT : RIGHT));

  // Ошибка возможна только когда ветка есть — бот бьёт прямо в неё.
  if (branch !== NONE && Math.random() < diff.err) chopAttempt(p, branch);
  else chopAttempt(p, safe);
}


/* =========================================================================
   10. ОТРИСОВКА — примитивы; заменяются на арт без правок логики.
   ========================================================================= */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

/* ---------- Обводка: общая для всех объектов ---------- */

/** Ставит перо чёрной обводки со скруглёнными стыками. */
function setOutline(w) {
  ctx.strokeStyle = PALETTE.outline;
  ctx.lineWidth = w || L.line;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
}

/** Заливает текущий путь и обводит его чёрным. */
function fillStroke(color, w) {
  ctx.fillStyle = color;
  ctx.fill();
  setOutline(w);
  ctx.stroke();
}

function circlePath(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 6.2832);
}

/** Толстая линия с круглыми торцами и обводкой: «рука» ветки, топорище. */
function outlinedBar(x0, y0, x1, y1, th, color) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  setOutline(th + L.line * 2);
  ctx.stroke();
  ctx.strokeStyle = color;
  ctx.lineWidth = th;
  ctx.stroke();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, PALETTE.zoneSkyTop);
  g.addColorStop(1, PALETTE.zoneSkyLow);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Облака: доля ширины зоны по x, доля высоты неба по y, радиус и скорость.
const CLOUDS = [
  { x: 0.16, y: 0.14, r: 0.085, sp: 0.009 },
  { x: 0.70, y: 0.30, r: 0.062, sp: 0.014 },
  { x: 0.38, y: 0.52, r: 0.098, sp: 0.006 },
  { x: 0.88, y: 0.68, r: 0.052, sp: 0.017 }
];

/** Медленно плывущие облака в небе зоны, позади дерева. */
function drawClouds(p) {
  const phase = p.index * 0.37;                  // зоны не зеркалят друг друга
  const lw = L.line * 0.8;
  for (const c of CLOUDS) {
    // Проезжают всю зону и с запасом уходят за края, без «выскакивания».
    const fx = (c.x + phase + clock * c.sp) % 1.4;
    const x = (fx - 0.2) * L.zw;
    const y = c.y * L.baseY;
    const r = c.r * L.zw;
    const puffs = [
      [0, 0, r],
      [-r * 0.78,  r * 0.16, r * 0.66],
      [ r * 0.74,  r * 0.20, r * 0.58],
      [-r * 0.08, -r * 0.44, r * 0.62]
    ];
    ctx.fillStyle = PALETTE.outline;
    for (const q of puffs) { circlePath(x + q[0], y + q[1], q[2] + lw); ctx.fill(); }
    ctx.fillStyle = PALETTE.white;
    for (const q of puffs) { circlePath(x + q[0], y + q[1], q[2]); ctx.fill(); }
  }
}

function drawGround() {
  ctx.fillStyle = PALETTE.groundDark;
  ctx.fillRect(0, L.baseY, L.zw, L.zh - L.baseY);
  ctx.fillStyle = PALETTE.ground;
  ctx.fillRect(0, L.baseY, L.zw, Math.max(10, L.ground * 0.45));
}

/**
 * Ствол — один ровный прямоугольник со скруглёнными торцами и обводкой,
 * без полос и сучков. Сегменты остаются только в логике; ход рубки
 * читается по тому, как съезжают вниз ветки.
 */
function drawTrunk(cx, topY, botY, w) {
  roundRect(cx - w / 2, topY, w, botY - topY, w * 0.30);
  fillStroke(PALETTE.trunk);
}

/**
 * Ветка — самый заметный объект на экране: короткая толстая тёмно-коричневая
 * «рука» от ствола и крупная ярко-зелёная крона.
 * Крона собирается из комов: сначала все чёрные подложки, поверх — все
 * зелёные. Так силуэт получает одну общую обводку без швов внутри.
 */
/**
 * Ветка растёт из ствола дугой вверх. Рисуется в два приёма:
 *  - drawBranchArm — дуга и наплыв у основания. Вызывается ДО ствола,
 *    чтобы обводка ствола перекрыла стык;
 *  - drawBranchCrown — крона на конце дуги, поверх ствола.
 * Хитбокс не меняется: логике по-прежнему важна только сторона ветки.
 */

/** Конец дуги ветки — точка, где сидит крона. */
function branchTip(cx, cy, dir, w) {
  const x0 = cx + dir * (w / 2 - L.line);
  return {
    x0, y0: cy,
    // Контрольная точка: от ствола уходит вбок, потом плавно вверх.
    kx: x0 + dir * L.branchLen * 0.62, ky: cy,
    x1: x0 + dir * L.branchLen, y1: cy - L.branchLen * 0.40
  };
}

/**
 * Строит путь дуги переменной толщины: от w0 у ствола до w1 на конце.
 * Канва не умеет сужать штрих, поэтому собираем контур сами по нормалям.
 */
function taperedArcPath(a, w0, w1) {
  const N = 16;
  const up = [], down = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, mt = 1 - t;
    const px = mt * mt * a.x0 + 2 * mt * t * a.kx + t * t * a.x1;
    const py = mt * mt * a.y0 + 2 * mt * t * a.ky + t * t * a.y1;
    const dx = 2 * mt * (a.kx - a.x0) + 2 * t * (a.x1 - a.kx);
    const dy = 2 * mt * (a.ky - a.y0) + 2 * t * (a.y1 - a.ky);
    const d  = Math.hypot(dx, dy) || 1;
    const hw = (w0 + (w1 - w0) * t) / 2;
    up.push([px - dy / d * hw, py + dx / d * hw]);
    down.push([px + dy / d * hw, py - dx / d * hw]);
  }
  ctx.beginPath();
  ctx.moveTo(up[0][0], up[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(up[i][0], up[i][1]);
  for (let i = N; i >= 0; i--) ctx.lineTo(down[i][0], down[i][1]);
  ctx.closePath();
}

/** Дуга ветки с наплывом у основания. Цвет — тот же, что у ствола. */
function drawBranchArm(cx, cy, side, w, h) {
  const dir = side === LEFT ? -1 : 1;
  const a   = branchTip(cx, cy, dir, w);
  const w0  = L.leafR * 0.62;              // у ствола толще
  const w1  = L.leafR * 0.40;              // к концу тоньше
  // Наплыв: сливается с контуром ствола, стык прячется под ним.
  const sx = a.x0 + dir * w0 * 0.15, sr = w0 * 0.78;

  // Подложка обводки: обводим обе фигуры, потом заливаем — так силуэт
  // получает одну общую обводку без шва между дугой и наплывом.
  setOutline(L.line * 2);
  taperedArcPath(a, w0, w1); ctx.stroke();
  circlePath(sx, cy, sr);    ctx.stroke();

  ctx.fillStyle = PALETTE.trunk;
  taperedArcPath(a, w0, w1); ctx.fill();
  circlePath(sx, cy, sr);    ctx.fill();
}

/** Крона: плоский зелёный овал с волнистым краем и смещённым бликом. */
function drawBranchCrown(cx, cy, side, w, h) {
  const dir = side === LEFT ? -1 : 1;
  const a   = branchTip(cx, cy, dir, w);
  const rx  = L.crownRx, ry = L.crownRy;
  const fx  = a.x1 + dir * rx * 0.45;
  const fy  = a.y1 - ry * 0.15;

  const N = 40;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const ang = i / N * 6.2832;
    // Две гармоники дают неровный край; dir разворачивает волну,
    // чтобы левые и правые кроны не были клонами.
    const k = 1 + 0.08 * Math.sin(5 * ang * dir + 0.6)
                + 0.05 * Math.sin(8 * ang * dir + 2.0);
    const px = fx + Math.cos(ang) * rx * k;
    const py = fy + Math.sin(ang) * ry * k;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  fillStroke(PALETTE.leaf);

  // Блик смещён от центра.
  circlePath(fx - dir * rx * 0.26, fy - ry * 0.20, ry * 0.20);
  fillStroke(PALETTE.leafDot, Math.max(3, L.line * 0.7));
}

/* ---------- Персонаж: спрайт плюс отдельный спрайт топора ---------- */

/** Угол топора и наклон корпуса по таймеру удара. */
function chopPose(chopT) {
  if (chopT <= 0) return { axe: 0, lean: 0 };
  const t = CHOP_TIME - chopT;                 // прошло с начала удара
  if (t < CHOP_WINDUP_T) {                     // замах
    return { axe: AXE_WINDUP_A * (t / CHOP_WINDUP_T), lean: 0 };
  }
  if (t < CHOP_HIT_T) {                        // удар, easeOutQuad
    const k = (t - CHOP_WINDUP_T) / CHOP_STRIKE_T;
    const e = 1 - (1 - k) * (1 - k);
    return { axe: AXE_WINDUP_A + (AXE_STRIKE_A - AXE_WINDUP_A) * e,
             lean: BODY_LEAN_A * e };
  }
  const k = Math.min(1, (t - CHOP_HIT_T) / CHOP_RETURN_T);   // плавный возврат
  const e = k * k * (3 - 2 * k);
  return { axe: AXE_STRIKE_A * (1 - e), lean: BODY_LEAN_A * (1 - e) };
}

/** Отлёт персонажа от ствола на промахе: сразу назад и плавно обратно. */
function knockOffset(p) {
  return p.knock > 0
    ? Math.pow(p.knock / MISS_KNOCK_T, 0.7) * MISS_KNOCK_PX
    : 0;
}

/** Локальная геометрия персонажа: где он стоит и какого размера. */
function charBox(p, cx) {
  const im = Sprites.get(p.sprite);
  const h  = L.charH;
  const w  = im ? h * im.naturalWidth / im.naturalHeight : h * 0.65;
  const away = p.side === LEFT ? -1 : 1;       // куда отлетать от ствола
  const x = cx + away * (L.trunkW * 0.5 + w * SPRITE_GAP + knockOffset(p));
  return { im, w, h, x, away, dir: -away };    // dir: +1 — спрайт смотрит вправо
}

/**
 * Рисует персонажа с топором в контекст g. Координаты — локальные для зоны,
 * точка привязки — низ спрайта на уровне земли.
 */
function paintCharacter(g, p, box) {
  const { im, w, h, x, dir } = box;
  const pose = chopPose(p.chop);
  const tilt = p.knock > 0 ? -MISS_TILT_A * (p.knock / MISS_KNOCK_T) : 0;
  const wob  = p.stun > 0 ? Math.sin(clock * 38) * 0.05 : 0;

  g.save();
  g.translate(x, L.baseY);
  g.scale(dir, 1);                    // правая сторона — зеркало
  g.rotate(pose.lean + tilt + wob);   // поворот вокруг точки у ног

  g.drawImage(im, -w / 2, -h, w, h);

  // Топор поверх персонажа, вращается вокруг торца рукояти у кисти.
  const axe = Sprites.get('axe');
  const aw  = h * AXE_LEN;
  const ah  = aw * axe.naturalHeight / axe.naturalWidth;
  g.save();
  g.translate(-w / 2 + HAND_PT.x * w, -h + HAND_PT.y * h);
  g.rotate(pose.axe);
  g.drawImage(axe, -AXE_PIVOT.x * aw, -AXE_PIVOT.y * ah, aw, ah);
  g.restore();

  g.restore();
}

/** Точка лезвия в координатах зоны — из неё летят щепки в момент контакта. */
function bladePoint(p, cx) {
  const box = charBox(p, cx);
  const axe = Sprites.get('axe');
  if (!box.im || !axe) return { x: cx, y: L.baseY - L.segH * 0.55 };

  const { w, h, x, dir } = box;
  const aw = h * AXE_LEN, ah = aw * axe.naturalHeight / axe.naturalWidth;
  const ang = chopPose(p.chop).axe;
  const dx = (AXE_EDGE.x - AXE_PIVOT.x) * aw;
  const dy = (AXE_EDGE.y - AXE_PIVOT.y) * ah;
  const c = Math.cos(ang), sn = Math.sin(ang);
  const lx = -w / 2 + HAND_PT.x * w + dx * c - dy * sn;
  const ly = -h + HAND_PT.y * h + dx * sn + dy * c;
  return { x: x + dir * lx, y: L.baseY + ly };
}

// Отдельная поверхность для красной вспышки поверх спрайта: source-atop
// на основном холсте закрасил бы и фон, поэтому красим персонажа отдельно.
let fxCanvas = null, fxCtx = null;
function fxSurface(w, h) {
  if (!fxCanvas) {
    fxCanvas = document.createElement('canvas');
    fxCtx = fxCanvas.getContext('2d');
  }
  if (fxCanvas.width < w || fxCanvas.height < h) {
    fxCanvas.width = Math.ceil(w); fxCanvas.height = Math.ceil(h);
  }
  fxCtx.setTransform(1, 0, 0, 1, 0, 0);
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  return fxCtx;
}

/** Персонаж целиком: спрайт, топор, красная вспышка и значок ошеломления. */
function drawCharacter(p, cx) {
  const box = charBox(p, cx);

  if (!box.im || !Sprites.ready(p.sprite)) {
    // Спрайты ещё не загрузились или не отдались — рисуем примитивами.
    drawLumberjackShapes(box.x, L.baseY, p.side, p.chop, p.stun);
  } else if (p.red > 0) {
    // Красим персонажа на отдельной поверхности размером с его коробку.
    const aw = box.h * AXE_LEN;
    const bx = box.x - box.w / 2 - aw, by = L.baseY - box.h - aw * 0.5;
    const bw = box.w + aw * 2,        bh = box.h + aw * 0.5 + box.h * 0.1;
    const g = fxSurface(bw * DPR, bh * DPR);
    g.setTransform(DPR, 0, 0, DPR, -bx * DPR, -by * DPR);
    paintCharacter(g, p, box);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = p.red * 0.6;
    g.fillStyle = PALETTE.stunTint;
    g.fillRect(0, 0, bw * DPR, bh * DPR);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    ctx.drawImage(fxCanvas, 0, 0, bw * DPR, bh * DPR, bx, by, bw, bh);
  } else {
    paintCharacter(ctx, p, box);
  }

  if (p.stun > 0) drawStunMark(box.x, L.baseY - box.h, box.h, p.stun);
}

/** Крутящиеся звёздочки и восклицательный знак над головой. */
function drawStunMark(x, topY, h, stunT) {
  const cy = topY - h * 0.18;
  ctx.save();
  ctx.globalAlpha = Math.min(1, stunT / 0.15);
  for (let i = 0; i < 3; i++) {
    const a = clock * 7 + i * 2.094;
    circlePath(x + Math.cos(a) * h * 0.30, cy + Math.sin(a) * h * 0.10, h * 0.06);
    fillStroke(PALETTE.accent, Math.max(3, L.line * 0.7));
  }
  ctx.fillStyle = PALETTE.danger;
  ctx.strokeStyle = PALETTE.outline;
  ctx.lineWidth = L.line;
  ctx.lineJoin = 'round';
  ctx.font = 'bold ' + Math.round(h * 0.42) + 'px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeText('!', x, cy - h * 0.02);
  ctx.fillText('!', x, cy - h * 0.02);
  ctx.restore();
}

/**
 * Запасная отрисовка примитивами — пока спрайты не загрузились.
 * (x, baseY) — точка опоры, side — с какой стороны ствола стоит,
 * chopT — остаток анимации удара, stunT — остаток ошеломления.
 */
function drawLumberjackShapes(x, baseY, side, chopT, stunT) {
  const h    = L.charH;
  const dir  = side === LEFT ? 1 : -1;     // куда смотрит (к стволу)
  const prog = chopT > 0 ? 1 - chopT / CHOP_TIME : 1;   // 0 — замах, 1 — удар
  const swing = chopT > 0
    ? (prog < 0.35 ? -0.75 * (prog / 0.35)                    // замах назад
                   : -0.75 + 1.70 * Math.pow((prog - 0.35) / 0.65, 0.6)) // удар
    : 0.35;                                                    // покой
  const wob = stunT > 0 ? Math.sin(clock * 38) * 0.16 : 0;

  ctx.save();
  ctx.translate(x, baseY);
  ctx.scale(dir, 1);
  ctx.rotate(wob);

  // Фигура приземистая и широкая: узкие детали обводка в 4–6 px съедает.
  const bodyW = h * 0.50;
  const lw    = Math.max(4, L.line * 0.8);   // обводка персонажа чуть тоньше

  // Ноги
  roundRect(-bodyW * 0.42, -h * 0.24, bodyW * 0.34, h * 0.24, bodyW * 0.15);
  fillStroke(PALETTE.pants, lw);
  roundRect( bodyW * 0.08, -h * 0.24, bodyW * 0.34, h * 0.24, bodyW * 0.15);
  fillStroke(PALETTE.pants, lw);
  // Ботинки — шире ног, чтобы фигура стояла
  roundRect(-bodyW * 0.48, -h * 0.09, bodyW * 0.44, h * 0.09, bodyW * 0.13);
  fillStroke(PALETTE.boots, lw);
  roundRect( bodyW * 0.04, -h * 0.09, bodyW * 0.44, h * 0.09, bodyW * 0.13);
  fillStroke(PALETTE.boots, lw);

  // Корпус, чуть подаётся вперёд на ударе
  const lean = chopT > 0 ? 0.12 * Math.sin(prog * Math.PI) : 0;
  ctx.save();
  ctx.translate(0, -h * 0.24);
  ctx.rotate(lean);

  roundRect(-bodyW / 2, -h * 0.34, bodyW, h * 0.36, bodyW * 0.30);
  fillStroke(PALETTE.shirt, lw);

  // Голова
  const headY = -h * 0.48, headR = h * 0.175;
  circlePath(bodyW * 0.05, headY, headR);
  fillStroke(PALETTE.skin, lw);

  // Шапка
  ctx.beginPath();
  ctx.arc(bodyW * 0.05, headY - headR * 0.30, headR, Math.PI * 1.04, Math.PI * 2.06);
  ctx.closePath();
  fillStroke(PALETTE.hair, lw);

  // Глаз
  ctx.fillStyle = PALETTE.outline;
  if (stunT > 0) {
    roundRect(bodyW * 0.16, headY + headR * 0.02, headR * 0.42, headR * 0.12, headR * 0.06);
    ctx.fill();
  } else {
    circlePath(bodyW * 0.22, headY + headR * 0.08, headR * 0.15);
    ctx.fill();
  }

  // Рука с топором
  ctx.save();
  ctx.translate(bodyW * 0.16, -h * 0.20);
  ctx.rotate(swing);
  outlinedBar(0, 0, h * 0.12, 0, h * 0.085, PALETTE.skin);
  outlinedBar(h * 0.08, 0, h * 0.38, 0, h * 0.07, PALETTE.axeHandle);
  ctx.beginPath();
  ctx.moveTo(h * 0.34, -h * 0.14);
  ctx.lineTo(h * 0.52, -h * 0.06);
  ctx.lineTo(h * 0.52,  h * 0.06);
  ctx.lineTo(h * 0.34,  h * 0.14);
  ctx.closePath();
  fillStroke(PALETTE.axeBlade, lw);
  ctx.restore();

  ctx.restore(); // корпус
  ctx.restore(); // персонаж

}

function drawParticles(p) {
  for (const q of p.particles) {
    const a = Math.min(1, q.life / (q.max * 0.5));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(q.x, q.y);
    ctx.rotate(q.rot);
    ctx.fillStyle = q.color;
    ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * 0.7);
    ctx.restore();
  }
}

/**
 * Счёт живёт у края зоны, а не по центру ствола: имя мелко, счёт крупно,
 * под ними полоска прогресса до WIN_SCORE. Игровое поле остаётся чистым.
 */
/**
 * Счёт прижат к внешнему краю зоны — к низу локальных координат. У нижнего
 * игрока это низ экрана, у верхнего (зона развёрнута) — верх. Поле в середине
 * экрана остаётся свободным.
 */
function drawScore(p) {
  const m  = Math.max(12, L.zw * 0.045);
  const sz = L.scoreSize;

  ctx.font = 'bold ' + sz + 'px system-ui, -apple-system, sans-serif';
  const tw = ctx.measureText(String(p.score)).width;
  const pw = Math.max(sz * 1.5, tw + sz * 0.7);
  const ph = sz * 1.18;
  const bh = Math.max(7, L.line * 1.4);

  const blockH = L.nameSize * 1.3 + ph + bh * 1.1 + bh;
  const y0 = L.zh - m - blockH;

  // Имя — мелко, над плашкой.
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = PALETTE.text;
  ctx.font = '700 ' + L.nameSize + 'px system-ui, -apple-system, sans-serif';
  ctx.fillText(p.name, m + L.line, y0);

  // Счёт — крупно на белой плашке: читается и поверх листвы.
  const py = y0 + L.nameSize * 1.3;
  const pop = 1 + p.scorePop * 0.22;
  ctx.save();
  ctx.translate(m, py);
  ctx.scale(pop, pop);
  roundRect(0, 0, pw, ph, ph * 0.32);
  fillStroke(p.scorePop > 0.5 ? PALETTE.accent : PALETTE.white);
  ctx.fillStyle = PALETTE.text;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + sz + 'px system-ui, -apple-system, sans-serif';
  ctx.fillText(String(p.score), pw / 2, ph * 0.54);
  ctx.restore();

  // Полоска прогресса до WIN_SCORE
  const by = py + ph + bh * 1.1;
  roundRect(m, by, pw, bh, bh / 2);
  fillStroke(PALETTE.white, Math.max(3, L.line * 0.55));
  const done = pw * Math.min(1, p.score / WIN_SCORE);
  if (done > bh) {
    roundRect(m, by, done, bh, bh / 2);
    fillStroke(PALETTE.accent, Math.max(3, L.line * 0.55));
  }
}

/** Полная отрисовка одной зоны в её локальных координатах (0..L.zw, 0..L.zh). */
function drawZone(p) {
  withZone(p, () => {
    // Фон зоны
    const sky = ctx.createLinearGradient(0, 0, 0, L.baseY);
    sky.addColorStop(0, PALETTE.zoneSkyTop);
    sky.addColorStop(1, PALETTE.zoneSkyLow);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, L.zw, L.zh);
    drawClouds(p);

    // Тряска зоны
    const sh = p.shake > 0 ? p.shake / p.shakeDur : 0;
    ctx.save();
    if (sh > 0) {
      ctx.translate((Math.random() - 0.5) * 2 * p.shakeMag * sh,
                    (Math.random() - 0.5) * 2 * p.shakeMag * sh);
    }

    drawGround();

    // Ствол одной фигурой снизу доверху, со смещением твина
    // (1 → 0 = дерево проезжает вниз на один сегмент).
    const cx = L.zw / 2;
    const slide = easeOut(p.trunkAnim) * L.segH;
    const count = Math.min(p.segments.length, L.visible + 1);
    // Дуги веток — до ствола: его обводка перекроет стык у основания.
    for (let i = count - 1; i >= 0; i--) {
      if (p.segments[i].branch === NONE) continue;
      const cy = segY(i, slide);
      if (cy - L.segH > L.zh) continue;
      drawBranchArm(cx, cy, p.segments[i].branch, L.trunkW, L.segH);
    }

    const topY = L.baseY - count * L.segH - slide;
    drawTrunk(cx, topY, L.baseY, L.trunkW);

    // Кроны веток поверх ствола. Нижнюю оставляем напоследок: крупный
    // персонаж иначе закрывает именно ту ветку, по которой игрок решает,
    // куда бить.
    for (let i = count - 1; i >= 1; i--) {
      if (p.segments[i].branch === NONE) continue;
      const cy = segY(i, slide);
      if (cy - L.segH > L.zh) continue;
      drawBranchCrown(cx, cy, p.segments[i].branch, L.trunkW, L.segH);
    }

    drawCharacter(p, cx);

    // Крона решающей нижней ветки — поверх всего.
    if (p.segments[0].branch !== NONE) {
      drawBranchCrown(cx, segY(0, slide), p.segments[0].branch, L.trunkW, L.segH);
    }

    drawParticles(p);
    ctx.restore(); // тряска

    // Подсветка половины зоны под пальцем — видно, какую сторону выбрал
    if (p.tapFlash > 0) {
      ctx.globalAlpha = (p.tapFlash / TAP_FLASH) * 0.28;
      ctx.fillStyle = PALETTE.white;
      ctx.fillRect(p.tapSide === LEFT ? 0 : L.zw / 2, 0, L.zw / 2, L.zh);
      ctx.globalAlpha = 1;
    }

    // Вспышка удара
    if (p.flash > 0) {
      ctx.globalAlpha = p.flash * 0.16;
      ctx.fillStyle = PALETTE.flash;
      ctx.fillRect(0, 0, L.zw, L.zh);
      ctx.globalAlpha = 1;
    }
    // Промах: вся зона краснеет коротко и резко
    if (p.red > 0) {
      ctx.globalAlpha = p.red * 0.5;
      ctx.fillStyle = PALETTE.stunTint;
      ctx.fillRect(0, 0, L.zw, L.zh);
      ctx.globalAlpha = Math.min(1, p.red * 1.6);
      ctx.strokeStyle = PALETTE.danger;
      ctx.lineWidth = L.line * 2.2;
      ctx.strokeRect(L.line, L.line, L.zw - L.line * 2, L.zh - L.line * 2);
      ctx.globalAlpha = 1;
    }

    drawScore(p);
  });
}

function easeOut(t) { return t * t; }   // твин ствола: быстрый старт, мягкий стоп

/** Центр сегмента i по вертикали с учётом твина опускания. */
function segY(i, slide) { return L.baseY - L.segH / 2 - i * L.segH - slide; }

function drawDivider() {
  const t = L.line * 1.4;
  ctx.fillStyle = PALETTE.divider;
  if (L.stacked) ctx.fillRect(0, L.zh - t / 2, W, t);
  else           ctx.fillRect(L.zw - t / 2, 0, t, H);
}

/** Крупный текст в стиле игры: белая заливка, чёрная обводка. */
function outlinedText(text, x, y, size, color) {
  ctx.font = 'bold ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
  setOutline(Math.max(4, Math.min(size * 0.10, 7)));
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || PALETTE.white;
  ctx.fillText(text, x, y);
}

function drawCountdown() {
  let label, frac, base;
  if (countdown > 0) {
    const t = countdown / CD_STEP_TIME;
    label = String(Math.ceil(t));
    frac  = t - Math.floor(t);           // 1 → 0 внутри одной цифры
    base  = Math.min(L.zw, L.zh) * 0.30;
  } else if (goFlash > 0) {
    label = 'РУБИ!';
    frac  = goFlash / GO_TIME;
    base  = Math.min(L.zw, L.zh) * 0.20;
  } else {
    return;
  }

  // По отсчёту в каждой зоне — верхний игрок читает свой в своей ориентации.
  for (const p of players) {
    withZone(p, () => {
      ctx.globalAlpha = 0.3 + frac * 0.7;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(label, L.zw / 2, L.zh * 0.5,
                   base * (1 + (1 - frac) * 0.3), PALETTE.accent);
      ctx.globalAlpha = 1;
    });
  }
}


/* ---------- Экраны меню ---------- */
function button(x, y, w, h, label, sub, action, hi) {
  buttons.push({ x, y, w, h, action });
  roundRect(x, y, w, h, h * 0.28);
  fillStroke(hi ? PALETTE.btnHi : PALETTE.btn, Math.max(4, L.line));

  ctx.fillStyle = PALETTE.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = sub ? 'alphabetic' : 'middle';
  ctx.font = 'bold ' + Math.round(Math.min(w * 0.105, 25)) + 'px system-ui, -apple-system, sans-serif';
  ctx.fillText(label, x + w / 2, sub ? y + h * 0.46 : y + h / 2);
  if (sub) {
    ctx.fillStyle = PALETTE.textDim;
    ctx.textBaseline = 'top';
    ctx.font = '500 ' + Math.round(Math.min(w * 0.062, 14)) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillText(sub, x + w / 2, y + h * 0.58);
  }
}

function drawTitle(title, subtitle) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(title, W / 2, H * 0.20, Math.min(W * 0.13, H * 0.09, 64));
  if (subtitle) {
    ctx.fillStyle = PALETTE.textDim;
    ctx.font = '500 ' + Math.round(Math.min(W * 0.045, 20)) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillText(subtitle, W / 2, H * 0.20 + Math.min(W * 0.10, 52));
  }
}

function drawMenu() {
  drawBackground();
  buttons = [];
  drawTitle('ЛЕСОРУБЫ', 'дуэль до ' + WIN_SCORE + ' очков');

  const bw = Math.min(W * 0.72, 420), bh = Math.min(H * 0.11, 84);
  const x = (W - bw) / 2;
  let y = H * 0.42;
  button(x, y, bw, bh, 'Против бота', 'сложность: ' + diff.name,
         () => { scene = 'difficulty'; }, true);
  y += bh + 18;
  button(x, y, bw, bh, 'На двоих',
         L.stacked ? 'один снизу, второй сверху' : 'один экран, два игрока',
         () => startGame('duo'), false);

  ctx.fillStyle = PALETTE.textDim;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '500 ' + Math.round(Math.min(W * 0.036, 15)) + 'px system-ui, -apple-system, sans-serif';
  ctx.fillText('Тапай по левой или правой половине своей зоны', W / 2, H * 0.88);
  ctx.fillText('Ветка с той же стороны — ошеломление', W / 2, H * 0.88 + 22);
}

function drawDifficulty() {
  drawBackground();
  buttons = [];
  drawTitle('Сложность', null);

  const bw = Math.min(W * 0.72, 420), bh = Math.min(H * 0.095, 72);
  const x = (W - bw) / 2;
  let y = H * 0.36;
  for (const d of DIFFICULTY) {
    button(x, y, bw, bh, d.name, null,
           () => { diff = d; startGame('bot'); }, d.id === diff.id);
    y += bh + 14;
  }
  button(x, y + 10, bw, bh * 0.8, 'Назад', null, () => { scene = 'menu'; }, false);
}

function drawGameOver() {
  // Позади — застывшее поле боя.
  drawBackground();
  for (const p of players) drawZone(p);
  drawDivider();

  ctx.fillStyle = 'rgba(20,18,16,0.55)';
  ctx.fillRect(0, 0, W, H);

  buttons = [];

  // Итог рисуем в каждой зоне: проигравший сверху читает его не вверх ногами.
  const pulse = 1 + Math.sin(clock * 4) * 0.03;
  const big   = Math.round(Math.min(L.zw * 0.13, L.zh * 0.11, 56));
  for (const p of players) {
    withZone(p, () => {
      const cx = L.zw / 2, cy = L.zh * (L.stacked ? 0.34 : 0.28);
      const word = p === winner ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + big + 'px system-ui, -apple-system, sans-serif';
      // Длинное слово ужимаем, чтобы не упиралось в края зоны.
      const fit = Math.min(1, (L.zw * 0.82) / ctx.measureText(word).width);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse * fit, pulse * fit);
      outlinedText(word, 0, 0, big, p === winner ? PALETTE.accent : PALETTE.white);
      ctx.restore();

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(players[0].score + ' : ' + players[1].score,
                   cx, cy + big * 1.1, big * 0.6);
    });
  }

  // Кнопки — одни на двоих, по центру экрана, до них дотягиваются оба.
  const bw = Math.min(W * 0.66, 380), bh = Math.min(H * 0.09, 72);
  const x  = (W - bw) / 2;
  let y = L.stacked ? H / 2 - bh - 8 : H * 0.58;
  button(x, y, bw, bh, 'Ещё раз', null, () => startGame(mode), true);
  y += bh + 16;
  button(x, y, bw, bh * 0.82, 'В меню', null, () => { scene = 'menu'; }, false);
}

function render() {
  if (scene === 'menu')            { drawMenu(); return; }
  if (scene === 'difficulty')      { drawDifficulty(); return; }
  if (scene === 'over')            { drawGameOver(); return; }

  drawBackground();
  for (const p of players) drawZone(p);
  drawDivider();
  drawCountdown();
}


/* =========================================================================
   11. ИГРОВОЙ ЦИКЛ — rAF + фиксированный шаг логики
   ========================================================================= */
let last = 0, acc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;          // вернулись из фона — не прокручиваем логику

  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }

  render();
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
