  canvas { display:block; width:100%; height:100%; touch-action:none; }

<body>
<canvas id="game"></canvas>
<script>
"use strict";

/* =========================================================================
   ЛЕСОРУБЫ — дуэль на одном экране
   Один файл, без сборки и внешних зависимостей.
   Разделы: ПАЛИТРА · КОНСТАНТЫ · СОСТОЯНИЕ · ЗВУК · YANDEX GAMES SDK ·
            ГЕНЕРАЦИЯ ДЕРЕВА · РАЗМЕТКА · ВВОД · ЛОГИКА · БОТ · ОТРИСОВКА ·
            ЦИКЛ
   ========================================================================= */


/* =========================================================================
   1. ПАЛИТРА  — всё, что красится, живёт здесь.
      Арт следующего этапа меняет цвета тут и тела draw*-функций ниже.
   ========================================================================= */
const PALETTE = {
  // Чёрная обводка — основа стиля, ею обводится каждый объект.
  outline:     '#141210',

  // Небо зоны: светлое, иначе чёрная обводка не читается.
  // Обе зоны красятся одинаково, чтобы в «стопке» не было видно шва.
  zoneSkyTop:  '#a6ebf5',
  zoneSkyLow:  '#c8f4f8',
  divider:     '#141210',

  // Облака — атмосфера: бледные, без обводки, часть с зеленцой.
  cloudPale:   '#f6fcff',
  cloudGreen:  '#e9f6e0',

  ground:      '#5ec93c',
  groundDark:  '#46ab2a',

  // Ветка красится этим же цветом — отдельной константы у неё нет.
  trunk:       '#8a5527',   // тёмный насыщенный ствол
  trunkHi:     '#e3b483',   // светлая полоса по центру ствола
  trunkCap:    '#5ec93a',   // зелёная «шапка» на торцах ствола

  leaf:        '#5ec93a',
  leafDot:     '#ffc63d',

  // Части фигуры красятся так, чтобы соседние никогда не были близки по
  // тону: иначе на маленьком спрайте шапка, борода и одежда слипаются
  // с чёрной обводкой в одно тёмное пятно.
  skin:        '#f7d3a6',
  hair:         '#4b3520',  // шапка-бини: тёмная, но не чёрная
  hairCuff:     '#7d5a33',  // отворот шапки — на тон светлее
  beard:        '#a8703c',  // борода светлее шапки и темнее кожи
  shirtRed:     '#ea5348',  // игрок 1
  shirtRedDark: '#c23a30',  // воротник, планка и манжет
  shirtBlue:    '#3f7fd0',  // игрок 2 и бот
  shirtBlueDark:'#2f62a8',
  pants:        '#31405c',  // тёмные штаны
  belt:         '#2a2118',  // ремень
  buckle:       '#e8b53c',  // пряжка
  boots:        '#7a4a25',  // коричневые ботинки — светлее штанов
  bootSole:     '#4a2c14',  // подошва темнее самого ботинка
  axeHandle:   '#c9974f',   // рукоять
  axeBlade:    '#d8e0e8',   // лезвие — светло-серое, не белое

  chip:        '#c9853d',
  chipDark:    '#8f5a26',
  shard:       '#3a2210',   // крупные щепки — почти чёрное дерево

  text:        '#1d1a16',
  textDim:     '#5d6b63',
  white:       '#ffffff',
  accent:      '#ffc63d',
  danger:      '#e8443a',

  btn:         '#ffffff',
  btnHi:       '#ffc63d',

  stunTint:    '#ff4a3d'
};


/* =========================================================================
   2. КОНСТАНТЫ
   ========================================================================= */
const WIN_SCORE    = 100;     // очков до победы
const STUN_TIME    = 0.7;     // сек. ошеломления
const TRUNK_TWEEN  = 0.08;    // сек. плавного опускания ствола
const SHAKE_TIME   = 0.12;    // сек. тряски зоны от удара
const SHAKE_MAG    = 3.5;     // px тряски от удара
const STUN_SHAKE_T = 0.30;    // сек. тряски от ошеломления
const STUN_SHAKE   = 8.0;     // px тряски от ошеломления
const RED_TIME     = 0.25;    // сек. красной заливки зоны на промахе

const DEG = Math.PI / 180;

/* --- Ствол: блики и торцы (доли ширины/высоты ствола) --- */
const TRUNK_ROUND   = 0.30;   // скругление углов — доля ширины ствола
// Вместо пятен-бликов — одна еле заметная светлая полоса по центру ствола
// во всю его высоту: даёт объём и не спорит с ветками.
const TRUNK_SHEEN_A = 0.15;   // прозрачность полосы
const TRUNK_SHEEN_W = 0.30;   // ширина полосы — доля ширины ствола
const TRUNK_CAP_H   = 0.34;   // высота «шапки»-среза на торце — доля ширины
const TRUNK_CAP_IN  = 0.06;   // насколько шапка уже ствола — доля ширины
// Основание у земли шире ствола — дерево «стоит», а не воткнуто.
const TRUNK_BASE_W  = 1.36;   // ширина основания — доля ширины ствола
const TRUNK_BASE_H  = 0.42;   // высота основания — доля ширины ствола
// Облака — фон, а не игровой объект: половинная «прозрачность» и тонкая
// обводка. Прозрачность сделана подмешиванием неба, а не globalAlpha: облако
// лежит прямо на небе, поэтому результат тот же, но два полупрозрачных слоя
// (подложка обводки и белый ком) не накладываются друг на друга и не серят.
const CLOUD_ALPHA   = 0.30;   // облака — атмосфера, а не объект

/* --- Ветка: доли L.branchLen, L.leafR, L.trunkW, L.crownR* --- */
const BR_BEND       = 0.62;   // вынос контрольной точки дуги вбок
const BR_DIP        = 0.09;   // прогиб у ствола: сперва вниз, потом вверх
const BR_LEN        = 0.95;   // длина дуги — доля высоты сегмента (стиль)
const BR_RISE       = 0.62;   // подъём конца дуги — доля её длины
const BRANCH_FIT    = 0.48;   // докуда крона дотягивается — доля ширины зоны
const BR_W0         = 0.58;   // толщина у ствола — доля leafR
const BR_W1         = 0.40;   // толщина на конце — доля leafR
const BR_FLARE      = 2.0;    // как быстро утолщение у ствола сходит на нет
const BR_ROOT       = 0.15;   // корень ветки внутри ствола — доля ширины ствола
const CROWN_R       = 0.58;   // радиус листвы — доля высоты сегмента
const CROWN_OFF     = 0.45;   // вынос центра кроны за конец дуги — доля rx
const CROWN_DOT_R   = 0.20;   // радиус жёлтого блика — доля ry
// Крона — облачко из пухлых долей: x, y и радиус в долях crownRx / crownRy.
// Силуэт сперва обводится целиком, потом заливается, поэтому доли сливаются
// в одну фигуру с общей обводкой, а края читаются как круглые бугры.
const CROWN_PUFFS   = [
  { x:  0.00, y: -0.35, r: 0.65 },
  { x: -0.45, y:  0.18, r: 0.55 },
  { x:  0.45, y:  0.18, r: 0.55 },
  { x:  0.00, y:  0.30, r: 0.55 }
];

/* --- Персонаж: все размеры — доли высоты фигуры h --- */
// Верхняя граница роста; фактический рост обычно ниже — его задаёт зазор до
// ветки следующего сегмента (см. computeLayout).
const CHAR_H       = 0.22;    // потолок высоты фигуры — доля высоты зоны
const CH_W         = 0.64;    // ширина коробки персонажа
const CH_LINE      = 0.85;    // обводка фигуры тоньше общей: детали мелкие
const CH_HEAD_R    = 0.21;    // крупная круглая голова
const CH_HEAD_Y    = 0.72;    // центр головы над землёй
const CH_HEAD_DX   = 0.03;    // голова чуть подана вперёд
const CH_BROW_A    = 0.60;    // шапка сдвинута вверх — доля радиуса головы
// Борода как на референсе: линия щеки идёт от бакенбарда у челюсти под ухом
// вперёд и вниз к усам, а плотная масса свисает под подбородком. Углы — по
// окружности головы: 0 — лицо на середине высоты, π/2 — низ, π — затылок.
const CH_BEARD_SIDE = 0.76;   // назад доходит до челюсти под ухом, доля π
const CH_BEARD_LIP  = 0.08;   // передний конец — усы у губы, доля π
const CH_BEARD_CHEEK= 0.40;   // насколько линия щеки заходит на лицо, доля hr
const CH_BEARD_OUT  = 0.46;   // вылет массы наружу под подбородком, доля hr
const CH_BEARD_TIP  = 0.05;   // вылет у самых концов — усы и бакенбард
const CH_BEARD_CLIP = 0.85;   // страховка: дальше назад борода не рисуется
const CH_EYE_R     = 0.032;
const CH_EYE       = { x: 0.10, y: -0.04 };  // глаз от центра головы
const CH_BODY_W    = 0.46;    // короткое плотное тело
const CH_BODY_H    = 0.32;
const CH_BODY_R    = 0.13;    // скругление тела
const CH_LEG_DX    = 0.11;    // ноги от оси
const CH_LEG_W     = 0.16;
const CH_LEG_H     = 0.19;
const CH_BOOT_W    = 0.22;
const CH_BOOT_H    = 0.09;
const CH_ARM_TH    = 0.09;    // толщина руки
const CH_SHOULDER  = { x: 0.10, y: 0.50 };   // плечо: от оси и над землёй
// Своя кисть на каждую позу: в покое рука согнута у плеча, в ударе вытянута
// вперёд к стволу. По высоте кисть в ударе не константа, а середина нижнего
// сегмента (см. handPoint): лезвие должно попадать ровно в тот сегмент,
// который исчезает, — только x задаётся здесь.
const CH_HAND_IDLE   = { x: 0.24, y: 0.38 };
const CH_HAND_STRIKE = { x: 0.40 };
const CH_HAND_LO     = 0.14;  // ниже этой доли h кисть не опускается
const CH_HAND_HI     = 0.55;  // и выше не поднимается
const CH_RED_MIX   = 0.55;    // доля красного в заливках на промахе

/* --- Детали фигуры: всё в долях высоты h, кроме покачивания в px --- */
const CH_BOB_PX    = 2;       // px покачивания в покое
const CH_BOB_T     = 1.2;     // сек. периода покачивания
const CH_EAR_RX    = 0.030;   // ухо — овал на щеке, поверх лица
const CH_EAR_RY    = 0.045;
const CH_EAR       = { x: -0.13, y: 0.03 };   // от центра головы
const CH_NOSE_R    = 0.045;   // нос-выступ на контуре лица
const CH_NOSE      = { x: 0.21, y: 0.02 };
const CH_BROW      = { x: 0.095, y: -0.085, w: 0.09, h: 0.024, a: -0.28 };
const CH_CAP_CUFF  = 0.062;   // высота отворота шапки
const CH_BEARD_WAVE  = 0.13;  // амплитуда волны внешнего края бороды
const CH_BEARD_LOBES = 3;     // сколько волн по внешнему краю
const CH_COLLAR_H  = 0.06;    // воротник
const CH_PLACKET_W = 0.045;   // планка по центру рубашки
const CH_PLACKET_X = 0.09;
const CH_CUFF_W    = 0.06;    // манжет у кисти
const CH_BELT_H    = 0.055;   // ремень
const CH_BUCKLE    = 0.06;    // пряжка
const CH_SOLE_H    = 0.035;   // подошва
const CH_FIST_R    = 0.062;   // кисть на рукояти
const CH_THUMB_R   = 0.032;   // большой палец поверх рукояти

/* --- Топор: доли длины топора (сама длина — доля высоты персонажа) --- */
const AXE_LEN        = 0.56;  // длина топора — доля высоты персонажа
const AXE_BUTT       = 0.20;  // хвост рукояти за кистью
const AXE_HANDLE_TH  = 0.15;  // толщина рукояти
// Голова сидит поперёк топорища: узкий обух за древком и широкий веер к
// длинной, чуть выгнутой режущей кромке. Всё — доли длины топора.
const AXE_HEAD_POS   = 0.86;  // где на топорище сидит голова
const AXE_HEAD_BUTT  = 0.15;  // вылет обуха за древко
const AXE_HEAD_W     = 0.50;  // вынос головы в сторону кромки
const AXE_HEAD_BH    = 0.14;  // полувысота у обуха, вдоль топорища
const AXE_HEAD_UP    = 0.38;  // вылет кромки к верху топорища
const AXE_HEAD_DN    = 0.32;  // вылет кромки к рукояти
const AXE_HEAD_BULGE = 0.07;  // выгиб кромки наружу
// Поза удара: топорище смотрит от зрителя в дерево, поэтому топор виден
// сильно укороченным — почти горизонтальной чертой, лезвие уходит в ствол.
const AXE_FORE_BACK  = 0.17;  // полувысота лезвия с торца у обуха
const AXE_FORE_EDGE  = 0.05;  // полувысота у самой кромки, уже в стволе
const AXE_FORE_L     = 0.48;  // длина головы с торца — доля длины топора,
                              // а не вылета: голова не растёт вместе с рукоятью
// На сколько лезвие входит в ствол в момент удара — доля высоты фигуры.
// Из неё выводится, где стоит персонаж (см. charBox).
const AXE_BITE       = 0.15;
// От оси фигуры до поверхности ствола — доля высоты фигуры. Из этой величины
// и AXE_BITE выводится длина топора в позе удара (см. strikeAxeLen).
const CHAR_STAND     = 0.68;  // зазор до ствола — доля высоты фигуры
const CHAR_CLEAR     = 0.12;  // зазор до кроны и до ветки над головой — доля роста
// Силуэт фигуры вбок от её оси — половина её коробки (CH_W): в покое туда же
// попадает поднятый топор, поэтому считаем по коробке, а не по телу.
const CH_SIDE        = CH_W / 2;

/* --- Удар: не анимация, а вторая поза --- */
const CHOP_HOLD     = 0.13;   // сек. удержания позы удара
const AXE_IDLE_A    = -80 * DEG;   // в покое топор поднят головой вверх
// В момент контакта топорище смотрит ровно в ствол: лезвие входит в дерево
// плашмя, а не бьёт рукоятью или углом.
const AXE_STRIKE_A  =   0 * DEG;
const BODY_LEAN_A   =   6 * DEG;   // наклон корпуса вперёд на ударе

/* --- Эффект удара: крупные клинья-щепки, линии скорости, мелкие крошки --- */
const SHARD_COUNT   = 3;      // крупных клиньев за удар
const SHARD_LIFE    = 0.40;   // сек. жизни клина
const SHARD_SIZE    = 0.55;   // размер клина — доля длины топора
const SHARD_SPIN    = 14;     // рад/с вращения
const SHARD_VX      = 220;    // px/с наружу от ствола, плюс разброс
const SHARD_VX_RND  = 200;
const SHARD_VY      = -430;   // подброс: клинья уходят дугой поверх фигуры
const SHARD_VY_RND  = 200;
const SHARD_G       = 1700;   // px/с² — за SHARD_LIFE клин успевает уйти по дуге
const SHARD_OUT     = 0.10;   // разнос точек вылета — доля длины топора
const DASH_COUNT    = 3;      // белых линий скорости
const DASH_LIFE     = 0.12;   // сек.
const DASH_LEN      = 0.50;   // длина линии — доля длины топора
const DASH_TILT     = 25 * DEG;   // веер наклонён вверх от горизонтали
const DASH_SPREAD   = 35 * DEG;   // полураствор веера
const DASH_SPEED    = 620;    // px/с разлёта
const DASH_W        = 0.07;   // толщина линии — доля её длины
const CHIP_COUNT    = 8;      // мелкие крошки — дополнение

/* --- Срубленная ветка улетает вместе с кроной --- */
const FLY_LIFE      = 0.60;   // сек. полёта до полного исчезновения
const FLY_VX        = 200;    // px/с от ствола, плюс разброс
const FLY_VX_RND    = 180;
const FLY_VY        = -260;   // подброс, дугу даёт гравитация
const FLY_VY_RND    = 160;
const FLY_G         = 1200;
const FLY_SPIN      = 7;      // рад/с, знак и величина случайны

/* --- Промах --- */
const MISS_KNOCK_PX = 15;     // px отлёта от ствола
const MISS_KNOCK_T  = 0.20;   // сек. отлёта и возврата
const MISS_TILT_A   = 12 * DEG;    // наклон спрайта назад

// Поза удара включается разом, поэтому контакт — в тот же кадр, что и тап.
const CHOP_TIME  = CHOP_HOLD;
const CHOP_HIT_T = 0;
const BRANCH_CHANCE= 0.95;    // вероятность ветки на новом сегменте
const BRANCH_GAP   = 1;       // сколько пустых сегментов между ветками
const MAX_SAME_RUN = 2;       // не больше двух веток подряд с одной стороны
const SAFE_START   = 2;       // первые сегменты — всегда без веток
// Рубить нельзя с той стороны, где ветка стоит перед лесорубом (ряд 0) или
// висит у него над головой (ряд HAZARD_SEG): после удара ствол опускается на
// сегмент, и такая ветка приходит ровно по макушке. Оба ряда проверяет
// blockedSide — по нему же целится бот и его же помечает крестик в подсказках.
const HAZARD_SEG   = 1;       // ряд на высоте головы
const MIN_TRUNK    = 14;      // минимум сегментов в памяти (дополняется под экран)
// Мышь и клавиатура вместо пальцев: на ПК подсказки другие — там жмут клавиши,
// а не тапают по половинам зоны. matchMedia честнее, чем ширина окна: узкое
// окно браузера на ПК — всё равно ПК.
const DESKTOP = !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches);

const TUTORIAL_TIME = 3.0;    // сек. показа подсказок перед первым забегом
const TUT_PULSE     = 6;      // рад/с пульсации кругов
const TUT_R         = 0.11;   // радиус круга-подсказки — доля ширины зоны
const TUT_Y         = 0.62;   // высота кругов — доля высоты неба зоны
const TUT_CROSS     = 0.62;   // размер крестика — доля радиуса кроны
const CD_STEPS     = 3;       // «3 · 2 · 1» перед боем
const CD_STEP_TIME = 0.55;    // сек. на цифру
const GO_TIME      = 0.45;    // сек. надписи «РУБИ!»
const STEP         = 1 / 120; // фиксированный шаг логики

const NONE = 'NONE', LEFT = 'LEFT', RIGHT = 'RIGHT';

// Уровни сложности бота: интервал удара сжимается по мере набора очков.
const DIFFICULTY = [
