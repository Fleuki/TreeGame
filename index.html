/* =========================================================================
   3. СОСТОЯНИЕ
   ========================================================================= */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d', { alpha:false });

let W = 0, H = 0, DPR = 1;          // размеры в CSS-пикселях
let L = {};                          // вычисленная разметка (см. computeLayout)

// Стартуем с экрана загрузки: пока не ответил SDK, цикл не запускаем.
let scene   = 'loading';             // 'loading' | 'menu' | 'difficulty' | 'play' | 'over'
let mode    = 'bot';                 // 'bot' | 'duo'
let diff    = DIFFICULTY[1];
let winner  = null;
let clock   = 0;                     // общее время, для колебаний
let countdown = 0;                   // отсчёт перед стартом
let goFlash = 0;                     // таймер надписи «РУБИ!»
let buttons = [];                    // активные кнопки текущей сцены
let tutorial = 0;                    // таймер подсказок первого забега

// Подсказки показываются один раз за сессию вкладки. sessionStorage может быть
// недоступен (приватный режим, iframe) — тогда просто покажем их снова.
const TUT_KEY = 'lumberjacks-tutorial-seen';
function tutorialSeen()     { try { return sessionStorage.getItem(TUT_KEY) === '1'; } catch (e) { return false; } }
function markTutorialSeen() { try { sessionStorage.setItem(TUT_KEY, '1'); } catch (e) {} }

function makePlayer(index, isBot) {
  return {
    index, isBot,
    name: isBot ? 'Бот' : (index === 0 ? 'Игрок 1' : 'Игрок 2'),
    segments: [],        // [0] — нижний сегмент, { branch: NONE|LEFT|RIGHT }
    score: 0,
    side: LEFT,          // с какой стороны ствола стоит персонаж
    chop: 0,             // таймер анимации удара
    stun: 0,             // таймер ошеломления
    stunFlip: null,      // куда перебраться, когда ошеломление спадёт
    trunkAnim: 0,        // 1 → 0, твин опускания ствола
    shake: 0, shakeDur: SHAKE_TIME, shakeMag: 0,
    red: 0,              // красная заливка зоны на промахе
    knock: 0,            // отлёт персонажа назад на промахе
    shirt:     index === 0 ? 'shirtRed'     : 'shirtBlue',      // цвет рубашки
    shirtDark: index === 0 ? 'shirtRedDark' : 'shirtBlueDark',  // её детали
    chipPending: false,  // щепки ждут момента контакта лезвия
    scorePop: 0,         // pop-анимация счётчика
    particles: [],
    botTimer: 0
  };
}
let players = [makePlayer(0, false), makePlayer(1, true)];


/* =========================================================================
   4. ЗВУК — Web Audio API, все тона генерируются на лету.
   ========================================================================= */
const Sound = (function () {
  const VOLUME = 0.45;
  let ac = null, master = null, noiseBuf = null, ok = true, muted = false;

  function ensure() {
    if (ac || !ok) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { ok = false; return; }
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : VOLUME;
    master.connect(ac.destination);

    const len = Math.floor(ac.sampleRate * 0.4);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  function unlock() {
    ensure();
    if (ac && ac.state === 'suspended') ac.resume();
  }

  /**
   * Полная тишина на время рекламы и пока игра свёрнута: гасим общий гейн,
   * а не отдельные голоса — уже запущенные звуки тоже замолкают. Флаг живёт
   * и до создания контекста: если звук ещё не включали, он появится уже
   * приглушённым.
   */
  function setMute(on) {
    muted = on;
    if (master) master.gain.value = on ? 0 : VOLUME;
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    ensure(); if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function noise(dur, vol, freq, q) {
    ensure(); if (!ac) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }

  return {
    unlock,
    mute: setMute,
    chop(pitch) {
      noise(0.09, 0.32, 1700, 0.9);
      tone(150 + pitch * 40, 0.085, 'square', 0.16, 70);
    },
    stun() {
      // Промах должен звучать как удар: низкий тон плюс глухой «бум».
      tone(130, 0.38, 'sawtooth', 0.30, 38);
      tone( 70, 0.26, 'sine',     0.34, 34);
      noise(0.20, 0.22, 200, 0.6);
    },
    tap()  { tone(520, 0.06, 'triangle', 0.14, 720); },
    tick() { tone(440, 0.09, 'triangle', 0.16); },
    go()   { tone(880, 0.18, 'triangle', 0.20); },
    win() {
      [523, 659, 784, 1046].forEach((f, i) =>
        tone(f, 0.16, 'triangle', 0.20, null, i * 0.09));
    }
  };
})();


/* =========================================================================
   4½. YANDEX GAMES SDK — единственное место, где игра знает про площадку.
   Весь остальной код зовёт только методы Yandex.*, поэтому без SDK (GitHub
   Pages, локальный файл, оффлайн) игра работает точно так же — без рекламы.
   ========================================================================= */
const AD_GAP    = 60;        // сек. — не чаще одного показа рекламы
const SDK_WAIT  = 4;         // сек. — столько ждём SDK на экране загрузки
const AD_HANG   = 30;        // сек. — после этого считаем, что реклама не закрылась

const Yandex = {
  sdk: null,
  ready: false,              // SDK на связи; false — играем без площадки
  lastAdTime: 0,             // мс, время последнего показа рекламы
  paused: false,             // реклама или свёрнутая игра: логика стоит, звука нет
  wantReady: false,          // игра готова показать первый экран
  readySent: false,          // LoadingAPI.ready() уже отправлен

  /**
   * Инициализация. Наружу не бросает ничего: нет скрипта, ответа или ответ с
   * ошибкой — ready остаётся false, и все методы становятся пустышками.
   * Ждём SDK не дольше SDK_WAIT, но обещание не бросаем: если площадка
   * ответит позже, она всё равно получит своё (см. attach) — иначе на медленной
   * сети игрок сидел бы на экране загрузки, а без LoadingAPI.ready() игру не
   * пропустила бы модерация.
   */
  async init() {
    try {
      if (typeof YaGames === 'undefined') return;
      const connect = YaGames.init()
        .then(sdk => this.attach(sdk))
        .catch(() => { this.sdk = null; this.ready = false; });
      await Promise.race([
        connect,
        new Promise(res => setTimeout(res, SDK_WAIT * 1000))
      ]);
    } catch (e) {
      this.sdk = null;
      this.ready = false;
    }
  },

  /** SDK ответил: запоминаем его и подписываемся на события площадки. */
  attach(sdk) {
    this.sdk = sdk;
    this.ready = true;
    // Реклама сразу после запуска не показывается: отсчёт AD_GAP идёт с
    // начала сессии, а не с нуля.
    this.lastAdTime = Date.now();
    try {
      // Площадка сама говорит, когда игру свернули или открыли своё окно.
      sdk.on('game_api_pause',  () => this.setPaused(true));
      sdk.on('game_api_resume', () => this.setPaused(false));
    } catch (e) { /* нет событий — не беда, игра работает */ }
    if (this.wantReady) this.loadingReady();   // игра ждала нас, а не наоборот
  },

  /**
   * Ресурсы загружены, первый экран готов. Без этого вызова игра не пройдёт
   * модерацию, поэтому если SDK ответил позже игры — вызов уходит из attach.
   */
  loadingReady() {
    this.wantReady = true;
    try {
      if (this.ready && !this.readySent) {
        this.sdk.features.LoadingAPI.ready();
        this.readySent = true;
      }
    } catch (e) { /* площадка сама разберётся, игре это не мешает */ }
  },

  /** Пауза: логику не крутим (см. frame), звук глушим целиком. */
  setPaused(on) {
    this.paused = on;
    Sound.mute(on);
  },

  /**
   * Реклама между забегами. Колбэк вызывается всегда — и когда рекламы нет,
   * и когда она не открылась: игровой код не должен знать про площадку.
   * Пауза и тишина ставятся до вызова, а не в onOpen: между вызовом и
   * открытием окна успел бы прозвучать звук нажатия.
   */
  showInterstitial(onDone) {
    let settled = false;
    // Колбэк ровно один раз, кто бы ни позвал: onClose, onError или страховка.
    const done = () => {
      if (settled) return;
      settled = true;
      this.setPaused(false);
      if (onDone) onDone();
    };
    // Рекламы не будет: SDK нет или прошло меньше AD_GAP. Пауза при этом не
    // трогается — вдруг игра стоит по просьбе площадки.
    if (!this.ready || Date.now() - this.lastAdTime < AD_GAP * 1000) {
      settled = true;
      if (onDone) onDone();
      return;
    }
    this.lastAdTime = Date.now();
    this.setPaused(true);
    try {
      this.sdk.adv.showFullscreenAdv({
        callbacks: {
          onOpen:  () => this.setPaused(true),
          onClose: done,
          onError: done
        }
      });
      // Страховка от чёрного экрана: если окно так и не закрылось, снимаем
      // паузу сами — лучше игра без рекламы, чем застывшая игра.
      setTimeout(done, AD_HANG * 1000);
    } catch (e) { done(); }
  }
};


/* =========================================================================
   5. ГЕНЕРАЦИЯ ДЕРЕВА
   ========================================================================= */
function nextSegment(segs) {
  // Между ветками держим пустые сегменты: дуги теперь высокие, и без зазора
  // кроны сливались бы в сплошную стену.
  for (let i = 1; i <= BRANCH_GAP; i++) {
    const prev = segs[segs.length - i];
    if (prev && prev.branch !== NONE) return { branch: NONE };
  }
  if (Math.random() >= BRANCH_CHANCE) return { branch: NONE };

  let side = Math.random() < 0.5 ? LEFT : RIGHT;

  // Не больше MAX_SAME_RUN веток подряд с одной стороны (с учётом зазора это
  // означает «не больше двух ветвей одной стороны через пустой сегмент»).
  let run = 0;
  for (let i = segs.length - 1; i >= 0; i--) {
    if (segs[i].branch === side) run++;
    else if (segs[i].branch !== NONE) break;
    if (segs.length - i > (MAX_SAME_RUN + 1) * (BRANCH_GAP + 1)) break;
  }
  if (run >= MAX_SAME_RUN) side = (side === LEFT ? RIGHT : LEFT);

  return { branch: side };
}

function trunkLength() {
  return Math.max(MIN_TRUNK, (L.visible || 10) + 2);
}

function buildTrunk() {
  const segs = [];
  const n = trunkLength();
  for (let i = 0; i < n; i++) {
    segs.push(i < SAFE_START ? { branch: NONE } : nextSegment(segs));
  }
  return segs;
}

/** После смены ориентации ствол может «не доставать» до верха — дорастим. */
function ensureTrunk(p) {
  const n = trunkLength();
  while (p.segments.length < n) p.segments.push(nextSegment(p.segments));
}


/* =========================================================================
   6. РАЗМЕТКА И МАСШТАБИРОВАНИЕ ХОЛСТА
   ========================================================================= */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeLayout();
  // Смена размера чистит канву, а кадр может и не прийти: на загрузке цикла
  // ещё нет, на паузе он ничего не рисует. Перерисуем сами.
  if (scene === 'loading' || Yandex.paused) render();
}

/*
 * Две раскладки зон:
 *  - «стопка» (телефон, экран выше, чем шире): зоны друг над другом, верхняя
 *    развёрнута на 180° — игроки садятся с двух сторон телефона, и каждому
 *    достаётся вся ширина экрана под тап;
 *  - «рядом» (ПК и альбомная): зоны слева и справа, как раньше.
 */
function computeLayout() {
  const stacked = H >= W;
  const zw = stacked ? W : W / 2;
  const zh = stacked ? H / 2 : H;

  const ground = Math.max(28, Math.min(zh * 0.13, 84));
  const baseY  = zh - ground;                      // линия земли внутри зоны
  // Шаг сегмента задан так, чтобы в зону влезало 8–9 рядов: между ветками
  // пустой сегмент, значит на экране 3–4 ветки — как на референсе, и кроны
  // не сливаются в стену.
  const segH   = Math.max(20, Math.min(zw * 0.26, (baseY - zh * 0.10) / 7));
  // Панель счёта компактная — она вспомогательная, поле важнее.
  const scoreSize = Math.round(Math.min(zw * 0.22, zh * 0.13, 68) / 1.5);

  // Толщина чёрной обводки — 4–6 px, чуть тянется за размером сегмента.
  const line = Math.max(4, Math.min(segH * 0.11, 6));

  // В «стопке» зона широкая, а высота сегмента задана по вертикали —
  // делаем ствол толще, иначе он теряется на широком экране.
  const trunkW = segH * (stacked ? 1.02 : 0.82);

  // Ветка — самый заметный объект: короткая толстая «рука» и крупная крона,
  // как на референсе. Крона не шире, чем позволяет узкая зона.
  let leafR      = Math.min(segH * CROWN_R, zw * 0.075);
  const crownRx0 = leafR * 1.35, crownHalf = crownRx0 * 1.05;

  // Длина дуги — стилевая доля сегмента, как на референсе: ветка сидит близко
  // к стволу, а крона проходит прямо над головой персонажа. Больше того, что
  // влезает в зону, не берём.
  const fitLen = zw * BRANCH_FIT - trunkW / 2 - crownRx0 * CROWN_OFF - crownHalf;
  let branchLen  = Math.min(segH * BR_LEN, fitLen);
  let branchRise = branchLen * BR_RISE;

  // Ближайшая к голове ветка сидит на следующем сегменте — её основание на
  // высоте 1.5·segH над землёй. У ствола дуга провисает (BR_DIP), дальше
  // уходит вверх и заканчивается кроной, поэтому важна не одна точка, а самая
  // низкая точка ветки над силуэтом фигуры. armLow возвращает, насколько
  // низко ветка (дуга с её толщиной или свес кроны) опускается относительно
  // своего основания на ширине силуэта.
  const armLow = (len, rise, h) => {
    const xa = trunkW / 2 + line + (CHAR_STAND - CH_SIDE) * h;   // от оси ствола
    const xb = trunkW / 2 + line + (CHAR_STAND + CH_SIDE) * h;
    const x0 = trunkW * BR_ROOT, kx = trunkW / 2 + len * BR_BEND;
    const x1 = trunkW / 2 + len;
    const w0 = leafR * BR_W0, w1 = leafR * BR_W1;
    let low = -Infinity;
    for (let i = 0; i <= 24; i++) {
      const t = i / 24, mt = 1 - t;
      const x = mt * mt * x0 + 2 * mt * t * kx + t * t * x1;
      if (x < xa || x > xb) continue;
      const y  = 2 * mt * t * len * BR_DIP - t * t * rise;
      const hw = (w1 + (w0 - w1) * Math.pow(mt, BR_FLARE)) / 2;
      low = Math.max(low, y + hw + line);
    }
    // Свес кроны: её центр вынесен за конец дуги, нижние доли висят на 0.85 ry
    // ниже центра. Считаем, если крона вообще нависает над фигурой.
    const ry = leafR * 1.02;
    const fx = x1 + crownRx0 * CROWN_OFF;
    if (fx + crownRx0 > xa && fx - crownRx0 < xb) {
      low = Math.max(low, -rise - ry * 0.15 + ry * 0.85 + line);
    }
    // Ни дуга, ни крона над фигурой не проходят — ограничения нет.
    return low > -Infinity ? low : -Infinity;
  };
  // Рост фигуры: сверху ограничен долей зоны (CHAR_H), но главное — макушка
  // должна оставаться под веткой соседнего сегмента с зазором CHAR_CLEAR.
  // Ширина силуэта сама зависит от роста, поэтому считаем в несколько
  // проходов: рост только убывает и быстро сходится.
  let charH = zh * CHAR_H;
  for (let pass = 0; pass < 4; pass++) {
    const low = armLow(branchLen, branchRise, charH);
    if (low === -Infinity) break;
    charH = Math.max(segH * 0.9,
                     Math.min(charH, (segH * 1.5 - low) / (0.94 + CHAR_CLEAR)));
  }
  if (branchLen < segH * 0.6) {                 // совсем узкая зона
    branchLen = segH * 0.6;
    branchRise = branchLen * BR_RISE;
    leafR     = Math.max(leafR * 0.7, segH * 0.35);
  }

  const crownRx = leafR * 1.35, crownRy = leafR * 1.02;

  L = {
    stacked,
    zw, zh,
    ground,
    baseY,
    segH,
    line,
    trunkW,
    branchLen,
    leafR,
    // Крона — приплюснутый овал. Соседние кроны могут слегка находить
    // друг на друга: у каждой своя обводка, и они читаются как две.
    crownRx, crownRy,
    branchRise,
    // Персонаж: высота — доля высоты зоны (см. CHAR_H).
    charH,
    scoreSize,
    nameSize: Math.max(11, Math.round(scoreSize * 0.38)),
    visible: Math.ceil(baseY / segH) + 1
  };
  if (players) for (const p of players) if (p.segments.length) ensureTrunk(p);
}

/** Положение зоны игрока на экране и нужен ли ей разворот на 180°. */
function zoneRect(p) {
  if (L.stacked) {
    return p.index === 0
      ? { x: 0, y: L.zh, rot: false }   // игрок 1 — снизу, как обычно
      : { x: 0, y: 0,    rot: true  };  // игрок 2 — сверху, вверх ногами
  }
  return { x: p.index * L.zw, y: 0, rot: false };
}

/** Выполняет fn в локальных координатах зоны (0..L.zw, 0..L.zh) с обрезкой. */
function withZone(p, fn) {
  const r = zoneRect(p);
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, L.zw, L.zh);
  ctx.clip();
  ctx.translate(r.x, r.y);
  if (r.rot) { ctx.translate(L.zw, L.zh); ctx.rotate(Math.PI); }
  fn();
  ctx.restore();
}


/* =========================================================================
   7. ВВОД — только touchstart/pointerdown, без задержек click
   ========================================================================= */
/** В чью зону попал тап. */
function playerAt(x, y) {
  if (L.stacked) return y < L.zh ? players[1] : players[0];
  return players[x < L.zw ? 0 : 1];
}

/**
 * Сторона удара в системе координат самого игрока: для верхней зоны экран
 * развёрнут, поэтому физически левый край для неё — правый.
 */
function sideOfTap(p, x, y) {
  const r = zoneRect(p);
  let lx = x - r.x;
  if (r.rot) lx = L.zw - lx;
  return lx < L.zw / 2 ? LEFT : RIGHT;
}

function onPoint(x, y) {
  // Идёт реклама или игра свёрнута — тапы не наши; на загрузке нажимать нечего.
  if (Yandex.paused || scene === 'loading') return;
  Sound.unlock();

  if (scene === 'play') {
    const p = playerAt(x, y);
    if (p.isBot) return;
    chopAttempt(p, sideOfTap(p, x, y));
    return;
  }

  for (const b of buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      Sound.tap();
      b.action();
      return;
    }
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    onPoint(t.clientX, t.clientY);
  }
}, { passive:false });

canvas.addEventListener('touchmove',  e => e.preventDefault(), { passive:false });
canvas.addEventListener('touchend',   e => e.preventDefault(), { passive:false });

// Мышь — для проверки на десктопе.
canvas.addEventListener('mousedown', e => { e.preventDefault(); onPoint(e.clientX, e.clientY); });

// Клавиатура — тоже для десктопа: A/D — левый игрок, ←/→ — правый.
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (Yandex.paused || scene === 'loading') return;
  Sound.unlock();
  if (scene !== 'play') {
    if (e.key === 'Enter' || e.key === ' ') { if (buttons[0]) buttons[0].action(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'a') chopAttempt(players[0], LEFT);
  else if (k === 'd') chopAttempt(players[0], RIGHT);
  else if (e.key === 'ArrowLeft')  chopAttempt(players[1], LEFT);
  else if (e.key === 'ArrowRight') chopAttempt(players[1], RIGHT);
});

// Гасим зум по двойному тапу, жесты и контекстное меню.
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('dblclick',    e => e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(n =>
  window.addEventListener(n, e => e.preventDefault(), { passive:false }));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));


/* =========================================================================
   8. ЛОГИКА
   ========================================================================= */
function startGame(newMode) {
  mode = newMode;
  players = [makePlayer(0, false), makePlayer(1, newMode === 'bot')];
  if (newMode === 'duo') players[1].name = 'Игрок 2';
  for (const p of players) {
    p.segments = buildTrunk();
    p.botTimer = diff.start;
  }
  winner = null;
  tutorial = tutorialSeen() ? 0 : TUTORIAL_TIME;
  countdown = CD_STEPS * CD_STEP_TIME;
  goFlash = 0;
  scene = 'play';
}

/**
 * Сторона, по которой рубить нельзя. Таких сторон не больше одной: между
 * ветками всегда есть пустой сегмент (BRANCH_GAP), поэтому в окне из двух
 * нижних рядов ветка может быть только одна.
 *  - ряд 0 — ветка на уровне фигуры: она прямо перед лесорубом, к стволу с
 *    этой стороны не подойти, рубить можно только с противоположной;
 *  - ряд HAZARD_SEG — ветка над головой: после удара ствол опустится на
 *    сегмент, и она придёт ровно по макушке.
 */
function blockedSide(p) {
  for (let i = 0; i <= HAZARD_SEG; i++) {
    const s = p.segments[i];
    if (s && s.branch !== NONE) return s.branch;
  }
  return NONE;
}

function chopAttempt(p, side) {
  if (scene !== 'play' || countdown > 0) return;

  // Первый же удар — подсказки больше не нужны.
  if (tutorial > 0) { tutorial = 0; markTutorialSeen(); }

  if (p.stun > 0) return;                     // ошеломлён — тапы игнорируются

  const bad = blockedSide(p);
  if (bad !== NONE && bad === side) {
    // Ветка с этой стороны: либо она прямо перед лесорубом, либо придёт по
    // макушке, когда ствол опустится. Удар не проходит: лесоруб шагнул под
    // ветку и там же стоит ошеломлённый, а на чистую сторону перебирается,
    // когда ошеломление спадёт (см. update).
    p.side = side;
    p.stunFlip = side === LEFT ? RIGHT : LEFT;
    p.stun = STUN_TIME;
    p.shake = STUN_SHAKE_T; p.shakeDur = STUN_SHAKE_T; p.shakeMag = STUN_SHAKE;
    p.red = 1;
    p.knock = MISS_KNOCK_T;
    spawnLeaves(p, side);
    Sound.stun();
    return;
  }

  p.side = side;
  p.chop = CHOP_TIME;

  // Чистый удар: нижний сегмент уходит, ствол опускается, сверху новый.
  const bottom = p.segments[0];
  if (bottom.branch !== NONE) spawnFlyingBranch(p, bottom.branch);
  p.segments.shift();
  p.segments.push(nextSegment(p.segments));
  p.trunkAnim = 1;
  p.score++;
  p.scorePop = 1;
  p.shake = SHAKE_TIME; p.shakeDur = SHAKE_TIME; p.shakeMag = SHAKE_MAG;
  p.chipPending = true;        // щепки полетят в момент контакта лезвия
  Sound.chop(p.score / WIN_SCORE);

  if (p.score >= WIN_SCORE) {
    winner = p;
    scene = 'over';
    Sound.win();
  }
}

/**
 * Эффект удара. Главное в нём — крупные тёмные клинья: они вылетают из точки
 * контакта, кувыркаются и уходят по дуге. Следом — короткие белые линии
 * скорости веером от той же точки, и уже как приправа — мелкие крошки.
 */
function spawnChips(p, side) {
  const dir = side === LEFT ? -1 : 1;          // наружу от ствола, в сторону удара
  const pt = bladePoint(p, L.zw / 2);          // из точки касания лезвия со стволом
  const x = pt.x, y = pt.y;
  const axe = L.charH * AXE_LEN;

  // Крупные клинья — размером примерно в половину топора.
  for (let i = 0; i < SHARD_COUNT; i++) {
    const off = (i / (SHARD_COUNT - 1) - 0.5) * 2 * axe * SHARD_OUT;
    p.particles.push({
      kind: 'shard',
      x: x + dir * Math.abs(off), y: y + off,
      vx: dir * (SHARD_VX + Math.random() * SHARD_VX_RND),
      vy: SHARD_VY + Math.random() * SHARD_VY_RND,
      g: SHARD_G,
      life: SHARD_LIFE, max: SHARD_LIFE,
      size: axe * SHARD_SIZE * (0.8 + Math.random() * 0.4),
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 2 * SHARD_SPIN,
      color: PALETTE.shard
    });
  }

  // Линии скорости: веер наружу и вверх, живут один миг.
  for (let i = 0; i < DASH_COUNT; i++) {
    // t — угол над горизонталью, чтобы веер одинаково работал на обе стороны.
    const t = DASH_TILT + (i / (DASH_COUNT - 1) - 0.5) * 2 * DASH_SPREAD;
    const vx = dir * Math.cos(t) * DASH_SPEED, vy = -Math.sin(t) * DASH_SPEED;
    p.particles.push({
      kind: 'dash',
      x, y,
      vx, vy,
      g: 0,
      life: DASH_LIFE, max: DASH_LIFE,
      size: axe * DASH_LEN,
      rot: Math.atan2(vy, vx), spin: 0,
      color: PALETTE.white
    });
  }

  // Мелкие крошки.
  for (let i = 0; i < CHIP_COUNT; i++) {
    p.particles.push({
      kind: 'chip',
      x, y,
      vx: dir * (60 + Math.random() * 220) + (Math.random() - 0.5) * 80,
      vy: -(120 + Math.random() * 220),
      g: 900,
      life: 0.45 + Math.random() * 0.35,
      max: 0.8,
      size: 3 + Math.random() * 4,
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 18,
      color: Math.random() < 0.5 ? PALETTE.chip : PALETTE.chipDark
    });
  }
}

/**
 * Срубленная ветка не исчезает, а улетает целиком — дуга и крона как один
 * объект: вращается вокруг своего центра, летит по дуге от ствола и тает.
 */
function spawnFlyingBranch(p, side) {
  const dir = side === LEFT ? -1 : 1;
  const cx  = L.zw / 2, cy = segY(0, 0);
  const c   = crownCenter(cx, cy, side, L.trunkW);
  p.particles.push({
    kind: 'branch', side,
    x: c.x, y: c.y,
    vx: dir * (FLY_VX + Math.random() * FLY_VX_RND),
    vy: FLY_VY + Math.random() * FLY_VY_RND,
    g: FLY_G,
    life: FLY_LIFE, max: FLY_LIFE,
    size: L.trunkW,
    rot: 0,
    spin: (Math.random() < 0.5 ? -1 : 1) * FLY_SPIN * (0.6 + Math.random() * 0.8),
    color: PALETTE.trunk
  });
}

function spawnLeaves(p, side) {
  const dir = side === LEFT ? -1 : 1;
  // Ветка пришлась по голове — листья сыплются от макушки, а не от комля.
  const x = L.zw / 2 + dir * (L.trunkW / 2 + L.line + CHAR_STAND * L.charH);
  const y = L.baseY - L.charH * 0.94;
  for (let i = 0; i < 10; i++) {
    p.particles.push({
      kind: 'chip',
      x, y,
      vx: dir * (30 + Math.random() * 140),
      vy: -(60 + Math.random() * 180),
      g: 620,
      life: 0.5 + Math.random() * 0.4,
      max: 0.9,
      size: 4 + Math.random() * 5,
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 12,
      color: Math.random() < 0.5 ? PALETTE.leaf : PALETTE.leafDot
    });
  }
}

function update(dt) {
  clock += dt;

  if (goFlash > 0) goFlash = Math.max(0, goFlash - dt);

  if (tutorial > 0) {
    tutorial = Math.max(0, tutorial - dt);
    if (tutorial === 0) markTutorialSeen();
  }

  if (scene === 'play' && countdown > 0) {
    const before = Math.ceil(countdown / CD_STEP_TIME);
    countdown -= dt;
    if (countdown < 0) countdown = 0;
    const after = Math.ceil(countdown / CD_STEP_TIME);
    if (after !== before) {
      if (after > 0) Sound.tick();
      else { Sound.go(); goFlash = GO_TIME; }
    }
  }

  for (const p of players) {
    if (p.chop > 0)      p.chop = Math.max(0, p.chop - dt);
    // Щепки — ровно в момент контакта лезвия со стволом.
    if (p.chipPending && CHOP_TIME - p.chop >= CHOP_HIT_T) {
      p.chipPending = false;
      spawnChips(p, p.side);
    }
    if (p.stun > 0) {
      p.stun = Math.max(0, p.stun - dt);
      // Отпустило — лесоруб перебирается на чистую сторону от ветки, в
      // которую только что влез.
      if (p.stun === 0 && p.stunFlip) { p.side = p.stunFlip; p.stunFlip = null; }
    }
    if (p.shake > 0)     p.shake = Math.max(0, p.shake - dt);
    if (p.red > 0)       p.red = Math.max(0, p.red - dt / RED_TIME);
    if (p.knock > 0)     p.knock = Math.max(0, p.knock - dt);
    if (p.scorePop > 0)  p.scorePop = Math.max(0, p.scorePop - dt * 5);
    if (p.trunkAnim > 0) p.trunkAnim = Math.max(0, p.trunkAnim - dt / TRUNK_TWEEN);

    for (let i = p.particles.length - 1; i >= 0; i--) {
      const q = p.particles[i];
      q.life -= dt;
      if (q.life <= 0) { p.particles.splice(i, 1); continue; }
      q.vy += q.g * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.rot += q.spin * dt;
    }

    if (p.isBot && scene === 'play' && countdown === 0) updateBot(p, dt);
  }
}


/* =========================================================================
   9. БОТ — интервал сжимается по ходу партии, иногда бьёт по ветке.
   ========================================================================= */
function botInterval(p) {
  const t = Math.min(1, p.score / WIN_SCORE);
  return diff.start + (diff.min - diff.start) * t;
}

function updateBot(p, dt) {
  if (p.stun > 0) { p.botTimer = botInterval(p) * 0.6; return; }

  p.botTimer -= dt;
  if (p.botTimer > 0) return;
  p.botTimer = botInterval(p) * (0.85 + Math.random() * 0.3);

  const branch = blockedSide(p);
  const safe = branch === LEFT ? RIGHT : (branch === RIGHT ? LEFT
              : (Math.random() < 0.5 ? LEFT : RIGHT));

  // Ошибка возможна только когда ветка есть — бот бьёт прямо в неё.
  if (branch !== NONE && Math.random() < diff.err) chopAttempt(p, branch);
  else chopAttempt(p, safe);
}


/* =========================================================================
   10. ОТРИСОВКА — всё фигурами на канве: цвета из PALETTE, размеры из констант.
   ========================================================================= */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

/* ---------- Обводка: общая для всех объектов ---------- */

/** Ставит перо чёрной обводки со скруглёнными стыками. */
function setOutline(w) {
  ctx.strokeStyle = PALETTE.outline;
  ctx.lineWidth = w || L.line;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
}

/** Заливает текущий путь и обводит его чёрным. */
function fillStroke(color, w) {
  ctx.fillStyle = tinted(color);
  ctx.fill();
  setOutline(w);
  ctx.stroke();
}

function circlePath(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 6.2832);
}

/** Толстая линия с круглыми торцами и обводкой: «рука» ветки, топорище. */
function outlinedBar(x0, y0, x1, y1, th, color) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  setOutline(th + L.line * 2);
  ctx.stroke();
  ctx.strokeStyle = tinted(color);
  ctx.lineWidth = th;
  ctx.stroke();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, PALETTE.zoneSkyTop);
  g.addColorStop(1, PALETTE.zoneSkyLow);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Облака: доля ширины зоны по x, доля высоты неба по y, радиус и скорость.
const CLOUDS = [
  { x: 0.16, y: 0.14, r: 0.060, sp: 0.009, green: false },
  { x: 0.70, y: 0.30, r: 0.043, sp: 0.014, green: true  },
  { x: 0.38, y: 0.52, r: 0.069, sp: 0.006, green: false },
  { x: 0.88, y: 0.68, r: 0.036, sp: 0.017, green: true  }
];

/**
 * Облака: без обводки и полупрозрачные — они читаются как атмосфера, а не как
 * игровой объект. Комья одного облака заливаются одним путём и одной
 * заливкой: при globalAlpha отдельные заливки дали бы видимые швы на
 * перекрытиях.
 */
function drawClouds(p) {
  const phase = p.index * 0.37;                  // зоны не зеркалят друг друга
  ctx.save();
  ctx.globalAlpha = CLOUD_ALPHA;
  for (const c of CLOUDS) {
    // Проезжают всю зону и с запасом уходят за края, без «выскакивания».
    const fx = (c.x + phase + clock * c.sp) % 1.4;
    const x = (fx - 0.2) * L.zw;
    const y = c.y * L.baseY;
    const r = c.r * L.zw;
    const puffs = [
      [0, 0, r],
      [-r * 0.78,  r * 0.16, r * 0.66],
      [ r * 0.74,  r * 0.20, r * 0.58],
      [-r * 0.08, -r * 0.44, r * 0.62]
    ];
    ctx.fillStyle = c.green ? PALETTE.cloudGreen : PALETTE.cloudPale;
    ctx.beginPath();
    for (const q of puffs) {
      ctx.moveTo(x + q[0] + q[2], y + q[1]);
      ctx.arc(x + q[0], y + q[1], q[2], 0, 6.2832);
    }
    ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  ctx.fillStyle = PALETTE.groundDark;
  ctx.fillRect(0, L.baseY, L.zw, L.zh - L.baseY);
  ctx.fillStyle = PALETTE.ground;
  ctx.fillRect(0, L.baseY, L.zw, Math.max(10, L.ground * 0.45));
}

/**
 * Ствол — ровный прямоугольник со скруглёнными торцами и обводкой.
 * Поверх: редкие светлые полупрозрачные штрихи (лёгкий объём, не текстура)
 * и зелёные «шапки»-срезы на верхнем и нижнем торце.
 * Сегменты остаются только в логике; ход рубки читается по веткам.
 */
function trunkPath(cx, topY, botY, w) {
  roundRect(cx - w / 2, topY, w, botY - topY, w * TRUNK_ROUND);
}

/**
 * Ствол вместе с ветками — одной фигурой: сперва обводятся все дуги и сам
 * ствол, потом всё заливается общим цветом. Внутренние обводки уходят под
 * заливку, снаружи остаётся единый контур — ветка перетекает в ствол без шва
 * и без чёрной черты поперёк стыка.
 * Поверх — светлые штрихи и зелёные торцы.
 */
function drawTrunk(cx, topY, botY, w, arms) {
  const h = botY - topY;

  setOutline(L.line * 2);
  for (const a of arms) { taperedArcPath(a.arc, a.w0, a.w1); ctx.stroke(); }
  trunkPath(cx, topY, botY, w); ctx.stroke();

  ctx.fillStyle = PALETTE.trunk;
  for (const a of arms) { taperedArcPath(a.arc, a.w0, a.w1); ctx.fill(); }
  trunkPath(cx, topY, botY, w); ctx.fill();

  // Светлая полоса по центру во всю высоту — лёгкий объём, не текстура.
  ctx.save();
  ctx.clip();                                  // не вылезает за контур ствола
  ctx.globalAlpha = TRUNK_SHEEN_A;
  ctx.fillStyle = PALETTE.trunkHi;
  const sw = w * TRUNK_SHEEN_W;
  roundRect(cx - sw / 2, topY, sw, h, sw / 2);
  ctx.fill();
  ctx.restore();

  // Торцы: сверху срез вровень со стволом, снизу — основание шире ствола.
  trunkCap(cx, topY, w - w * TRUNK_CAP_IN * 2, w * TRUNK_CAP_H);
  trunkCap(cx, botY, w * TRUNK_BASE_W,         w * TRUNK_BASE_H);
}

/** Зелёная скруглённая «шапка» на торце ствола: срез сверху, основание снизу. */
function trunkCap(cx, y, cw, ch) {
  roundRect(cx - cw / 2, y - ch / 2, cw, ch, ch / 2);
  fillStroke(PALETTE.trunkCap);
}

/**
 * Ветка — самый заметный объект на экране: короткая толстая тёмно-коричневая
 * «рука» от ствола и крупная ярко-зелёная крона.
 * Крона собирается из комов: сначала все чёрные подложки, поверх — все
 * зелёные. Так силуэт получает одну общую обводку без швов внутри.
 */
/**
 * Ветка растёт из ствола дугой вверх. Рисуется в два приёма:
 *  - drawBranchArm — дуга и наплыв у основания. Вызывается ДО ствола,
 *    чтобы обводка ствола перекрыла стык;
 *  - drawBranchCrown — крона на конце дуги, поверх ствола.
 * Хитбокс не меняется: логике по-прежнему важна только сторона ветки.
 */

/**
 * Влезает ли крона ветки в зону целиком. Ветку, которая пересекает верхнюю
 * границу, не рисуем вовсе: клип по зоне срезал бы её ровно по разделителю,
 * и на стыке две обрезанные кроны соседних зон слипались бы в одно пятно.
 */
function branchFitsZone(cy) {
  const top = cy - L.branchRise - L.crownRy * 1.15 - L.line * 2;
  return top > 0;
}

/** Центр кроны ветки — им пользуются и отрисовка, и подсказка-крестик. */
function crownCenter(cx, cy, side, w) {
  const dir = side === LEFT ? -1 : 1;
  const a = branchTip(cx, cy, dir, w);
  return { x: a.x1 + dir * L.crownRx * CROWN_OFF, y: a.y1 - L.crownRy * 0.15 };
}

/** Конец дуги ветки — точка, где сидит крона. */
function branchTip(cx, cy, dir, w) {
  const edge = cx + dir * w / 2;               // край ствола
  return {
    // Дуга начинается внутри ствола: наружу выходит её середина, а стык
    // прячется под заливкой ствола — ветка вырастает из дерева, а не
    // приставлена к нему торцом.
    x0: cx + dir * w * BR_ROOT, y0: cy,
    // Контрольная точка ниже основания: ветка сперва слегка провисает,
    // потом уходит вбок и вверх — тот самый изгиб, а не прямая палка.
    kx: edge + dir * L.branchLen * BR_BEND, ky: cy + L.branchLen * BR_DIP,
    x1: edge + dir * L.branchLen, y1: cy - L.branchRise
  };
}

/**
 * Строит путь дуги переменной толщины: от w0 у ствола до w1 на конце.
 * Канва не умеет сужать штрих, поэтому собираем контур сами по нормалям.
 * Утолщение спадает не линейно, а со степенью BR_FLARE: у ствола выходит
 * гладкий раструб, а дальше ветка идёт почти ровной.
 */
function taperedArcPath(a, w0, w1) {
  const N = 16;
  const up = [], down = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, mt = 1 - t;
    const px = mt * mt * a.x0 + 2 * mt * t * a.kx + t * t * a.x1;
    const py = mt * mt * a.y0 + 2 * mt * t * a.ky + t * t * a.y1;
    const dx = 2 * mt * (a.kx - a.x0) + 2 * t * (a.x1 - a.kx);
    const dy = 2 * mt * (a.ky - a.y0) + 2 * t * (a.y1 - a.ky);
    const d  = Math.hypot(dx, dy) || 1;
    const hw = (w1 + (w0 - w1) * Math.pow(1 - t, BR_FLARE)) / 2;
    up.push([px - dy / d * hw, py + dx / d * hw]);
    down.push([px + dy / d * hw, py - dx / d * hw]);
  }
  // Конец дуги скруглён, как на референсе: ветка не обрублена торцом, а
  // заканчивается округлым носом (его почти целиком накрывает крона).
  const tx = a.x1 - a.kx, ty = a.y1 - a.ky;
  const td = Math.hypot(tx, ty) || 1;
  const cap = w1 * 0.67;
  ctx.beginPath();
  ctx.moveTo(up[0][0], up[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(up[i][0], up[i][1]);
  ctx.quadraticCurveTo(a.x1 + tx / td * cap, a.y1 + ty / td * cap,
                       down[N][0], down[N][1]);
  for (let i = N - 1; i >= 0; i--) ctx.lineTo(down[i][0], down[i][1]);
  ctx.closePath();
}

/**
 * Геометрия дуги ветки: сама она рисуется вместе со стволом (drawTrunk),
 * одной фигурой с ним. Корень дуги уходит внутрь ствола, поэтому наружу
 * выходит только гладкое утолщение — ветка вырастает из дерева.
 * Цвет — тот же, что у ствола (PALETTE.trunk).
 */
/** Дуга ветки отдельной фигурой — для срубленной ветки в полёте. */
function drawBranchArm(cx, cy, side, w) {
  const a = branchArm(cx, cy, side, w);
  setOutline(L.line * 2);
  taperedArcPath(a.arc, a.w0, a.w1); ctx.stroke();
  ctx.fillStyle = tinted(PALETTE.trunk);
  taperedArcPath(a.arc, a.w0, a.w1); ctx.fill();
}

function branchArm(cx, cy, side, w) {
  return {
    arc: branchTip(cx, cy, side === LEFT ? -1 : 1, w),
    w0:  L.leafR * BR_W0,                  // у ствола толще
    w1:  L.leafR * BR_W1                   // к концу тоньше
  };
}

/**
 * Крона — зелёное «облачко»: несколько пухлых долей сливаются в одну фигуру.
 * Сперва обводим все доли, потом заливаем — силуэт получает общую обводку
 * без швов внутри, а край читается круглыми буграми. Сверху — жёлтый блик.
 * dir разворачивает раскладку долей, чтобы левые и правые кроны не были клонами.
 */
function drawBranchCrown(cx, cy, side, w, h) {
  const dir = side === LEFT ? -1 : 1;
  const a   = branchTip(cx, cy, dir, w);
  const rx  = L.crownRx, ry = L.crownRy;
  const fx  = a.x1 + dir * rx * CROWN_OFF;
  const fy  = a.y1 - ry * 0.15;

  const puff = (q) => {
    ctx.beginPath();
    ctx.ellipse(fx + dir * q.x * rx, fy + q.y * ry, q.r * rx, q.r * ry, 0, 0, 6.2832);
  };

  setOutline(L.line * 2);
  for (const q of CROWN_PUFFS) { puff(q); ctx.stroke(); }
  ctx.fillStyle = PALETTE.leaf;
  for (const q of CROWN_PUFFS) { puff(q); ctx.fill(); }

  // Жёлтая точка-блик, смещённая от центра.
  circlePath(fx - dir * rx * 0.20, fy - ry * 0.22, ry * CROWN_DOT_R);
  fillStroke(PALETTE.leafDot, Math.max(3, L.line * 0.7));
}

/* ---------- Персонаж и топор: только фигуры, без спрайтов ---------- */

/**
 * Подмешивание красного в заливки персонажа на промахе. Ставится на время
 * отрисовки фигуры и снимается сразу после: fillStroke и outlinedBar
 * прогоняют цвет через tinted().
 */
let tintK = 0;

function mixColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const m = (sh) => Math.round((((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t));
  return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1);
}

function tinted(color) {
  return tintK > 0 ? mixColor(color, PALETTE.stunTint, tintK) : color;
}

/**
 * Две позы, без промежуточной анимации: покой (топор закинут на плечо) и
 * удар (топорище смотрит от зрителя в дерево). Поза переключается разом,
 * поэтому удар читается мгновенно, как щелчок.
 */
function chopPose(chopT) {
  return chopT > 0
    ? { axe: AXE_STRIKE_A, lean: BODY_LEAN_A, strike: true }
    : { axe: AXE_IDLE_A,   lean: 0,           strike: false };
}

/** Отлёт персонажа от ствола на промахе: сразу назад и плавно обратно. */
function knockOffset(p) {
  return p.knock > 0
    ? Math.pow(p.knock / MISS_KNOCK_T, 0.7) * MISS_KNOCK_PX
    : 0;
}

/**
 * Длина топора в позе удара. Топорище направлено от зрителя в ствол, поэтому
 * видно его укороченным; длина берётся ровно такой, чтобы кромка зашла за
 * поверхность ствола на AXE_BITE.
 */
function strikeAxeLen(h) {
  return (CHAR_STAND + AXE_BITE - CH_HAND_STRIKE.x) * h;
}

/** Вынос режущей кромки от кисти вдоль топорища в текущей позе. */
function bladeReach(h, pose) {
  return pose.strike ? strikeAxeLen(h) : h * AXE_LEN;
}

/**
 * Локальная геометрия персонажа: где он стоит и какого размера.
 * Расстояние до ствола — CHAR_STAND: персонаж стоит вплотную, топор достаёт
 * дерево вытянутой рукой. Длина топора в ударе считается из этого же
 * расстояния, поэтому лезвие всегда входит в ствол ровно на AXE_BITE.
 */
function charBox(p, cx) {
  const h = L.charH;
  const w = h * CH_W;
  const away = p.side === LEFT ? -1 : 1;       // куда отлетать от ствола
  // Видимый край ствола — половина ширины плюс обводка: она лежит снаружи,
  // потому что ствол с ветками сперва обводится, а потом заливается.
  const surface = L.trunkW * 0.5 + L.line;
  const x = cx + away * (surface + CHAR_STAND * h + knockOffset(p));
  return { w, h, x, away, dir: -away };        // dir: +1 — фигура смотрит вправо
}

/**
 * Кисть в локальных координатах фигуры (ось у ног, +x — в сторону ствола).
 * В покое рука согнута и держит топор у плеча. В ударе она вытянута вперёд, а
 * по высоте опущена ровно на середину нижнего сегмента — туда, куда придётся
 * лезвие: топор бьёт в тот же сегмент, который исчезает, оттуда же летят
 * щепки и там же нарисована его ветка. Границы CH_HAND_LO/HI держат руку в
 * пределах фигуры на любой раскладке.
 */
function handPoint(pose, h) {
  const shoulder = { sx: CH_SHOULDER.x * h, sy: -CH_SHOULDER.y * h };
  if (!pose.strike) {
    return { x: CH_HAND_IDLE.x * h, y: -CH_HAND_IDLE.y * h, ...shoulder };
  }
  const y = Math.min(Math.max(L.segH / 2, h * CH_HAND_LO), h * CH_HAND_HI);
  return { x: CH_HAND_STRIKE.x * h, y: -y, ...shoulder };
}

/**
 * Топор сбоку — поза покоя. Рисуется в координатах кисти: рукоять уходит
 * в −x (от ствола), голова — в +x. Голова несимметричная: у обуха узкая, к
 * режущей кромке уходит длинным вылетом в одну сторону — так силуэт читается
 * топором, а не молотком. Фигура целиком зеркалится через scale(dir, 1),
 * поэтому на правой стороне лезвие так же смотрит в ствол.
 */
function drawAxeShape(len, lw) {
  const th = len * AXE_HANDLE_TH;
  const c  = len * AXE_HEAD_POS;               // голова на топорище
  const bh = len * AXE_HEAD_BH, bt = len * AXE_HEAD_BUTT;
  const wd = len * AXE_HEAD_W;
  const up = len * AXE_HEAD_UP, dn = len * AXE_HEAD_DN;

  // Скруглённое топорище во всю длину: верх уйдёт под голову.
  roundRect(-len * AXE_BUTT, -th / 2, len * AXE_BUTT + len, th, th / 2);
  fillStroke(PALETTE.axeHandle, lw);

  // Голова поперёк топорища: обух за древком, дальше веер к кромке.
  ctx.beginPath();
  ctx.moveTo(c + bh, -bt);
  ctx.lineTo(c + up,  wd);
  // Кромка — длинная и чуть выгнутая наружу.
  ctx.quadraticCurveTo(c + (up - dn) / 2, wd + len * AXE_HEAD_BULGE, c - dn, wd);
  ctx.lineTo(c - bh, -bt);
  ctx.closePath();
  fillStroke(PALETTE.axeBlade, lw);
}

/**
 * Топор в позе удара: топорище направлено от зрителя в дерево, поэтому видно
 * его почти горизонтальной чертой, а голову — с торца, узким клином, кромка
 * которого уже сидит в стволе.
 */
function drawAxeStrike(len, full, lw) {
  const th  = full * AXE_HANDLE_TH;
  // Голова — компактный клин на конце: её размер задан самим топором, иначе
  // при большом вылете рукояти топор превращается в пику.
  const bx0 = len - full * AXE_FORE_L;

  roundRect(-full * AXE_BUTT, -th / 2, full * AXE_BUTT + bx0 + th, th, th / 2);
  fillStroke(PALETTE.axeHandle, lw);

  const bk = full * AXE_FORE_BACK, ed = full * AXE_FORE_EDGE;
  ctx.beginPath();
  ctx.moveTo(bx0, -bk);
  ctx.lineTo(len, -ed);
  ctx.lineTo(len,  ed);
  ctx.lineTo(bx0,  bk);
  ctx.closePath();
  fillStroke(PALETTE.axeBlade, lw);
}

/**
 * Лесоруб фигурами: крупная круглая голова с бородой, короткое плотное
 * тело, толстая чёрная обводка. Цвет рубашки — из p.shirt.
 * Точка привязки — низ фигуры на линии земли.
 */
function drawLumberjack(p, box) {
  const { w, h, x, dir } = box;
  const pose = chopPose(p.chop);
  const tilt = p.knock > 0 ? -MISS_TILT_A * (p.knock / MISS_KNOCK_T) : 0;
  const wob  = p.stun > 0 ? Math.sin(clock * 38) * 0.05 : 0;
  const lw   = Math.max(3, L.line * CH_LINE);
  // В покое фигура едва заметно дышит — стоячий персонаж не выглядит мёртвым.
  const bob  = pose.strike ? 0 : Math.sin(clock * 6.2832 / CH_BOB_T) * CH_BOB_PX;

  ctx.save();
  ctx.translate(x, L.baseY + bob);
  ctx.scale(dir, 1);                  // правая сторона — зеркало
  ctx.rotate(pose.lean + tilt + wob); // поворот вокруг точки у ног

  drawLegs(h, lw);
  const hand = handPoint(pose, h);
  drawArm(p, hand, h, lw);
  drawBody(p, h, lw);
  drawHead(p, h, lw);

  // Топор поверх фигуры, кисть — поверх топора: она обхватывает рукоять.
  ctx.save();
  ctx.translate(hand.x, hand.y);
  ctx.rotate(pose.axe);
  if (pose.strike) drawAxeStrike(strikeAxeLen(h), h * AXE_LEN, lw);
  else             drawAxeShape(h * AXE_LEN, lw);
  ctx.restore();
  drawFist(hand, pose, h, lw);

  ctx.restore();
}

/** Ноги в тёмных штанах и коричневые ботинки с тёмной подошвой. */
function drawLegs(h, lw) {
  for (const s of [-1, 1]) {
    const lx = s * CH_LEG_DX * h;
    roundRect(lx - CH_LEG_W * h / 2, -CH_LEG_H * h,
              CH_LEG_W * h, CH_LEG_H * h, CH_LEG_W * h * 0.4);
    fillStroke(PALETTE.pants, lw);

    const bx = lx - CH_BOOT_W * h * 0.4;
    roundRect(bx, -CH_BOOT_H * h, CH_BOOT_W * h, CH_BOOT_H * h, CH_BOOT_H * h * 0.5);
    fillStroke(PALETTE.boots, lw);
    // Подошва — та же форма, но только нижняя полоса, поэтому её обрезаем.
    ctx.save();
    ctx.clip();
    roundRect(bx, -CH_SOLE_H * h, CH_BOOT_W * h, CH_SOLE_H * h, CH_SOLE_H * h * 0.4);
    ctx.fillStyle = tinted(PALETTE.bootSole);
    ctx.fill();
    ctx.restore();
  }
}

/** Рука от плеча к кисти, с манжетом рубашки у запястья. */
function drawArm(p, hand, h, lw) {
  outlinedBar(hand.sx, hand.sy, hand.x, hand.y, CH_ARM_TH * h, PALETTE.skin);

  // Манжет — поперёк руки, чуть не доходя до кисти.
  const ax = hand.x - hand.sx, ay = hand.y - hand.sy;
  const len = Math.hypot(ax, ay) || 1;
  const cw = CH_CUFF_W * h;
  ctx.save();
  ctx.translate(hand.x - ax / len * cw * 0.9, hand.y - ay / len * cw * 0.9);
  ctx.rotate(Math.atan2(ay, ax));
  roundRect(-cw / 2, -CH_ARM_TH * h * 0.62, cw, CH_ARM_TH * h * 1.24, cw * 0.3);
  fillStroke(PALETTE[p.shirtDark], lw);
  ctx.restore();
}

/** Кисть, обхватывающая рукоять: кулак и большой палец поверх неё. */
function drawFist(hand, pose, h, lw) {
  circlePath(hand.x, hand.y, CH_FIST_R * h);
  fillStroke(PALETTE.skin, lw);
  const tx = hand.x + Math.cos(pose.axe) * CH_FIST_R * h * 0.55;
  const ty = hand.y + Math.sin(pose.axe) * CH_FIST_R * h * 0.55;
  circlePath(tx, ty, CH_THUMB_R * h);
  fillStroke(PALETTE.skin, lw);
}

/** Тело: рубашка, тёмный воротник, планка по центру и ремень с пряжкой. */
function drawBody(p, h, lw) {
  const bw = CH_BODY_W * h;
  const top = -(CH_LEG_H + CH_BODY_H) * h, bot = -CH_LEG_H * h;

  roundRect(-bw / 2, top, bw, CH_BODY_H * h, CH_BODY_R * h);
  fillStroke(PALETTE[p.shirt], lw);

  // Детали рубашки живут внутри её силуэта.
  ctx.save();
  ctx.clip();
  ctx.fillStyle = tinted(PALETTE[p.shirtDark]);
  roundRect(-bw / 2, top, bw, CH_COLLAR_H * h, CH_COLLAR_H * h * 0.4);
  ctx.fill();
  roundRect(CH_PLACKET_X * h - CH_PLACKET_W * h / 2, top,
            CH_PLACKET_W * h, bot - top, CH_PLACKET_W * h * 0.3);
  ctx.fill();
  ctx.restore();

  // Ремень поверх рубашки, у самого пояса.
  const beltY = bot - CH_BELT_H * h;
  roundRect(-bw / 2, beltY, bw, CH_BELT_H * h, CH_BELT_H * h * 0.25);
  fillStroke(PALETTE.belt, lw);
  roundRect(CH_PLACKET_X * h - CH_BUCKLE * h / 2, beltY + (CH_BELT_H - CH_BUCKLE) * h / 2,
            CH_BUCKLE * h, CH_BUCKLE * h, CH_BUCKLE * h * 0.25);
  fillStroke(PALETTE.buckle, Math.max(2, lw * 0.7));
}

/**
 * Голова в профиль: ухо сзади, нос-выступ на контуре лица, шапка-бини с
 * отворотом, фигурная борода с волнистым краем, бровь и глаз.
 * Ухо, нос и череп сперва обводятся целиком, потом заливаются — обводка
 * остаётся только по внешнему контуру, и детали не режут друг друга.
 */
function drawHead(p, h, lw) {
  const hx = CH_HEAD_DX * h, hy = -CH_HEAD_Y * h, hr = CH_HEAD_R * h;

  const nose = () => circlePath(hx + CH_NOSE.x * h, hy + CH_NOSE.y * h, CH_NOSE_R * h);
  const skull= () => circlePath(hx, hy, hr);

  // Нос и череп — один силуэт: обводим оба, потом заливаем, иначе обводка
  // черепа перечеркнула бы выступ носа.
  setOutline(lw * 2);
  nose(); ctx.stroke(); skull(); ctx.stroke();
  ctx.fillStyle = tinted(PALETTE.skin);
  nose(); ctx.fill(); skull(); ctx.fill();

  // Ухо — уже поверх лица, со своей обводкой: в профиль оно ближе к затылку.
  ctx.beginPath();
  ctx.ellipse(hx + CH_EAR.x * h, hy + CH_EAR.y * h,
              CH_EAR_RX * h, CH_EAR_RY * h, 0, 0, 6.2832);
  fillStroke(PALETTE.skin, Math.max(2, lw * 0.7));

  drawBeard(hx, hy, hr, lw);

  // Шапка-бини: скруглённый купол и отворот на тон светлее.
  ctx.beginPath();
  ctx.arc(hx, hy - hr * CH_BROW_A, hr * 1.02, Math.PI * 1.02, Math.PI * 2.08);
  ctx.closePath();
  fillStroke(PALETTE.hair, lw);
  const cuffY = hy - hr * CH_BROW_A;
  roundRect(hx - hr * 1.02, cuffY - CH_CAP_CUFF * h * 0.5,
            hr * 2.04, CH_CAP_CUFF * h, CH_CAP_CUFF * h * 0.5);
  fillStroke(PALETTE.hairCuff, lw);

  // Бровь и глаз.
  ctx.save();
  ctx.translate(hx + CH_BROW.x * h, hy + CH_BROW.y * h);
  ctx.rotate(CH_BROW.a);
  roundRect(-CH_BROW.w * h / 2, -CH_BROW.h * h / 2,
            CH_BROW.w * h, CH_BROW.h * h, CH_BROW.h * h * 0.5);
  fillStroke(PALETTE.hair, Math.max(2, lw * 0.6));
  ctx.restore();

  ctx.fillStyle = tinted(PALETTE.outline);
  if (p.stun > 0) {   // на ошеломлении глаз — чёрточка
    roundRect(hx + CH_EYE.x * h - CH_EYE_R * h * 1.6, hy + CH_EYE.y * h,
              CH_EYE_R * h * 3.2, CH_EYE_R * h * 0.9, CH_EYE_R * h * 0.45);
    ctx.fill();
  } else {
    circlePath(hx + CH_EYE.x * h, hy + CH_EYE.y * h, CH_EYE_R * h);
    ctx.fill();
  }
}

/**
 * Борода в профиль: линия щеки идёт от бакенбарда у челюсти под ухом вперёд и
 * вниз к усам, а внешний край уходит массой под подбородок и возвращается к
 * челюсти волной. У концов масса сходит почти на нет — там усы и бакенбард.
 * Затылок остаётся чистым: за CH_BEARD_CLIP назад ничего не рисуется (клип —
 * страховка, сама фигура туда и не заходит). Сторона отдельно не задаётся:
 * фигура зеркалится вместе с лицом.
 */
function drawBeard(hx, hy, hr, lw) {
  const aS = CH_BEARD_SIDE * Math.PI, aL = CH_BEARD_LIP * Math.PI;
  const N = 24;

  ctx.save();
  ctx.beginPath();
  ctx.rect(hx - hr * CH_BEARD_CLIP, hy - hr * 2, hr * 4, hr * 4);
  ctx.clip();

  ctx.beginPath();
  // Линия щеки: по лицу, от бакенбарда к усам. В середине заходит глубже —
  // это скула, а не ровная дуга по контуру головы.
  for (let i = 0; i <= N; i++) {
    const u = i / N, a = aS + (aL - aS) * u;
    const r = hr * (1 - CH_BEARD_CHEEK * Math.pow(Math.sin(Math.PI * u), 0.8));
    const x = hx + Math.cos(a) * r, y = hy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  // Внешний край: обратно к челюсти, с массой под подбородком и волной.
  for (let i = 0; i <= N; i++) {
    const v = i / N, a = aL + (aS - aL) * v;
    const f = Math.pow(Math.sin(Math.PI * Math.pow(v, 0.75)), 1.1);
    const t = (CH_BEARD_TIP + (CH_BEARD_OUT - CH_BEARD_TIP) * f)
            * (1 + CH_BEARD_WAVE * Math.sin(CH_BEARD_LOBES * 2 * Math.PI * v));
    ctx.lineTo(hx + Math.cos(a) * hr * (1 + t), hy + Math.sin(a) * hr * (1 + t));
  }
  ctx.closePath();
  fillStroke(PALETTE.beard, Math.max(2, lw * 0.8));
  ctx.restore();
}

/**
 * Точка кромки лезвия в координатах зоны — из неё летят щепки.
 * Наклон корпуса на ударе мал, им пренебрегаем.
 */
function bladePoint(p, cx) {
  const box  = charBox(p, cx);
  const pose = chopPose(p.chop);
  const hand = handPoint(pose, box.h);
  const r    = bladeReach(box.h, pose);
  const lx   = hand.x + r * Math.cos(pose.axe);
  const ly   = hand.y + r * Math.sin(pose.axe);
  return { x: box.x + box.dir * lx, y: L.baseY + ly };
}

/** Персонаж целиком: фигура с топором, краснота промаха и значок ошеломления. */
function drawCharacter(p, cx) {
  const box = charBox(p, cx);

  tintK = p.red > 0 ? Math.min(1, p.red) * CH_RED_MIX : 0;
  drawLumberjack(p, box);
  tintK = 0;

  if (p.stun > 0) drawStunMark(box.x, L.baseY - box.h, box.h, p.stun);
}

/** Крутящиеся звёздочки и восклицательный знак над головой. */
function drawStunMark(x, topY, h, stunT) {
  const cy = topY - h * 0.18;
  ctx.save();
  ctx.globalAlpha = Math.min(1, stunT / 0.15);
  for (let i = 0; i < 3; i++) {
    const a = clock * 7 + i * 2.094;
    circlePath(x + Math.cos(a) * h * 0.30, cy + Math.sin(a) * h * 0.10, h * 0.06);
    fillStroke(PALETTE.accent, Math.max(3, L.line * 0.7));
  }
  ctx.fillStyle = PALETTE.danger;
  ctx.strokeStyle = PALETTE.outline;
  ctx.lineWidth = L.line;
  ctx.lineJoin = 'round';
  ctx.font = 'bold ' + Math.round(h * 0.42) + 'px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeText('!', x, cy - h * 0.02);
  ctx.fillText('!', x, cy - h * 0.02);
  ctx.restore();
}

/**
 * Частицы трёх видов: крупный клин-щепка (тёмный треугольник с обводкой),
 * линия скорости (короткий белый штрих) и мелкая крошка-квадратик.
 */
function drawParticles(p) {
  for (const q of p.particles) {
    const a = Math.min(1, q.life / (q.max * 0.5));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(q.x, q.y);
    ctx.rotate(q.rot);

    if (q.kind === 'branch') {
      // Ветка строится в координатах ствола, поэтому смещаем её так, чтобы
      // центр кроны оказался в точке частицы — вокруг него и вращаем.
      const c = crownCenter(0, 0, q.side, q.size);
      ctx.translate(-c.x, -c.y);
      drawBranchArm(0, 0, q.side, q.size);
      drawBranchCrown(0, 0, q.side, q.size);
    } else if (q.kind === 'shard') {
      const s = q.size;
      ctx.beginPath();
      ctx.moveTo( s * 0.55,  0);
      ctx.lineTo(-s * 0.45, -s * 0.34);
      ctx.lineTo(-s * 0.30,  s * 0.40);
      ctx.closePath();
      fillStroke(q.color, Math.max(2, L.line * 0.7));
    } else if (q.kind === 'dash') {
      ctx.strokeStyle = q.color;
      ctx.lineWidth = Math.max(2, q.size * DASH_W);
      ctx.lineCap = 'round';
      // Штрих тянется от точки удара наружу, а не в обе стороны от неё.
      ctx.beginPath();
      ctx.moveTo(-q.size * 0.12, 0);
      ctx.lineTo( q.size * 0.88, 0);
      ctx.stroke();
    } else {
      ctx.fillStyle = q.color;
      ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * 0.7);
    }
    ctx.restore();
  }
}

/**
 * Счёт живёт у края зоны, а не по центру ствола: имя мелко, счёт крупно,
 * под ними полоска прогресса до WIN_SCORE. Игровое поле остаётся чистым.
 */
/**
 * Счётчик — один на двоих, как на референсе: плашка сидит на самой линии
 * раздела и повёрнута вдоль неё, поэтому никому не достаётся вверх ногами.
 * Цифра каждого игрока в цвете его рубахи и с его стороны от точки: у
 * нижнего — снизу, у верхнего — сверху. Часть плашки уходит за край экрана,
 * чтобы она не лезла в поле.
 */
function drawScoreBoard() {
  if (!players || players.length < 2) return;
  const sz  = Math.round(L.scoreSize * 0.8);
  const dot = ' • ';
  ctx.font = 'bold ' + sz + 'px system-ui, -apple-system, sans-serif';
  // players[0] — нижний (в «стопке») или левый игрок: его цифра идёт первой.
  const s = players.map(p => String(p.score));
  const w0 = ctx.measureText(s[0]).width;
  const wd = ctx.measureText(dot).width;
  const w1 = ctx.measureText(s[1]).width;
  const tw = w0 + wd + w1;
  const pw = tw + sz * 0.9, ph = sz * 1.3;

  ctx.save();
  if (L.stacked) {
    // Линия раздела горизонтальная: текст пускаем вдоль неё снизу вверх —
    // первая цифра оказывается у нижнего игрока, вторая у верхнего.
    ctx.translate(ph * 0.45, L.zh);
    ctx.rotate(-Math.PI / 2);
  } else {
    // Зоны рядом — оба сидят ровно, плашку кладём на верх разделителя.
    ctx.translate(L.zw, ph * 0.65);
  }

  roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2);
  fillStroke(PALETTE.white, Math.max(4, L.line));

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + sz + 'px system-ui, -apple-system, sans-serif';
  const colors = [PALETTE.shirtRed, PALETTE.shirtBlue];
  const mids = [-tw / 2 + w0 / 2, tw / 2 - w1 / 2];
  for (let i = 0; i < 2; i++) {
    // Своя цифра подпрыгивает на очке — так видно, кому оно ушло.
    const pop = 1 + players[i].scorePop * 0.35;
    ctx.save();
    ctx.translate(mids[i], 0);
    ctx.scale(pop, pop);
    ctx.fillStyle = colors[i];
    ctx.fillText(s[i], 0, sz * 0.05);
    ctx.restore();
  }
  ctx.fillStyle = PALETTE.textDim;
  ctx.fillText(dot, mids[0] + w0 / 2 + wd / 2, sz * 0.05);
  ctx.restore();
}

/** Полная отрисовка одной зоны в её локальных координатах (0..L.zw, 0..L.zh). */
function drawZone(p) {
  withZone(p, () => {
    // Фон зоны
    const sky = ctx.createLinearGradient(0, 0, 0, L.baseY);
    sky.addColorStop(0, PALETTE.zoneSkyTop);
    sky.addColorStop(1, PALETTE.zoneSkyLow);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, L.zw, L.zh);
    drawClouds(p);

    // Тряска зоны
    const sh = p.shake > 0 ? p.shake / p.shakeDur : 0;
    ctx.save();
    if (sh > 0) {
      ctx.translate((Math.random() - 0.5) * 2 * p.shakeMag * sh,
                    (Math.random() - 0.5) * 2 * p.shakeMag * sh);
    }

    drawGround();

    // Ствол одной фигурой снизу доверху, со смещением твина
    // (1 → 0 = дерево проезжает вниз на один сегмент).
    const cx = L.zw / 2;
    const slide = easeOut(p.trunkAnim) * L.segH;
    const count = Math.min(p.segments.length, L.visible + 1);
    // Дуги веток собираются заранее: ствол рисует их вместе с собой, одной
    // фигурой с общей обводкой — иначе на стыке была бы чёрная черта.
    const arms = [];
    for (let i = count - 1; i >= 0; i--) {
      if (p.segments[i].branch === NONE) continue;
      const cy = segY(i, slide);
      if (cy - L.segH > L.zh || !branchFitsZone(cy)) continue;
      arms.push(branchArm(cx, cy, p.segments[i].branch, L.trunkW));
    }

    const topY = L.baseY - count * L.segH - slide;
    drawTrunk(cx, topY, L.baseY, L.trunkW, arms);

    // Кроны поверх ствола, персонаж — поверх крон: его не должно закрывать
    // ничем, он и его топор и есть то, за чем следит игрок.
    for (let i = count - 1; i >= 0; i--) {
      if (p.segments[i].branch === NONE) continue;
      const cy = segY(i, slide);
      if (cy - L.segH > L.zh || !branchFitsZone(cy)) continue;
      drawBranchCrown(cx, cy, p.segments[i].branch, L.trunkW, L.segH);
    }

    drawCharacter(p, cx);

    drawParticles(p);
    if (tutorial > 0 && scene === 'play') drawTutorial(p, cx, slide);
    ctx.restore(); // тряска

    // Белых заливок на тап и на удар нет: отклик даёт сама фигура, щепки и
    // тряска, а засветка всей зоны перебивала их и слепила на каждом ударе.
    // Промах: вся зона краснеет коротко и резко
    if (p.red > 0) {
      ctx.globalAlpha = p.red * 0.5;
      ctx.fillStyle = PALETTE.stunTint;
      ctx.fillRect(0, 0, L.zw, L.zh);
      ctx.globalAlpha = Math.min(1, p.red * 1.6);
      ctx.strokeStyle = PALETTE.danger;
      ctx.lineWidth = L.line * 2.2;
      ctx.strokeRect(L.line, L.line, L.zw - L.line * 2, L.zh - L.line * 2);
      ctx.globalAlpha = 1;
    }

  });
}

/**
 * Подсказки первого забега — без единого слова, чтобы не переводить их и не
 * заставлять читать: два пульсирующих круга на левой и правой половине зоны
 * (сюда тапать) и крестик на кроне нижней ветки (сюда — нельзя).
 * Гаснут за последние полсекунды или на первом же ударе.
 */
function drawTutorial(p, cx, slide) {
  const a = Math.min(1, tutorial / 0.5);
  const pulse = 0.5 + 0.5 * Math.sin(clock * TUT_PULSE);
  ctx.save();
  ctx.globalAlpha = a;

  // Куда тапать: круг на каждой половине зоны. На ПК в кругах стоят клавиши
  // этого игрока — у левого A / D, у правого стрелки.
  const r = L.zw * TUT_R * (0.86 + 0.14 * pulse);
  const y = L.baseY * TUT_Y;
  const keys = p.index === 0 ? ['A', 'D'] : ['\u2190', '\u2192'];
  [0.25, 0.75].forEach((s, i) => {
    circlePath(L.zw * s, y, r);
    ctx.fillStyle = PALETTE.white;
    ctx.globalAlpha = a * (0.18 + 0.16 * pulse);
    ctx.fill();
    ctx.globalAlpha = a;
    setOutline(Math.max(3, L.line * 0.8));
    ctx.stroke();
    if (DESKTOP) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(keys[i], L.zw * s, y, r * 1.1);
    }
  });

  // Чего избегать: крестик на ближайшей снизу ветке. Опасна любая — сначала
  // как ветка над головой, потом как ветка на уровне фигуры.
  let bi = -1;
  for (let i = 0; i < p.segments.length; i++) {
    const cy = segY(i, slide);
    if (p.segments[i].branch === NONE) continue;
    if (cy < 0 || !branchFitsZone(cy)) continue;
    bi = i; break;
  }
  if (bi >= 0) {
    const branch = p.segments[bi].branch;
    const c = crownCenter(cx, segY(bi, slide), branch, L.trunkW);
    const d = L.crownRy * TUT_CROSS * (0.9 + 0.1 * pulse);
    ctx.lineCap = 'round';
    for (const pass of [0, 1]) {
      ctx.strokeStyle = pass ? PALETTE.danger : PALETTE.outline;
      ctx.lineWidth = pass ? L.line * 1.6 : L.line * 3.2;
      ctx.beginPath();
      ctx.moveTo(c.x - d, c.y - d); ctx.lineTo(c.x + d, c.y + d);
      ctx.moveTo(c.x + d, c.y - d); ctx.lineTo(c.x - d, c.y + d);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function easeOut(t) { return t * t; }   // твин ствола: быстрый старт, мягкий стоп

/** Центр сегмента i по вертикали с учётом твина опускания. */
/**
 * Центр сегмента i по вертикали с учётом твина опускания. Нижний сегмент
 * стоит на земле, а его середина приходится ровно на точку удара лезвия
 * (см. segH в computeLayout): топор, щепки, исчезающий сегмент и его ветка —
 * на одной высоте. Ветка сегмента i рисуется ровно на сегменте i.
 */
function segY(i, slide) { return L.baseY - L.segH / 2 - i * L.segH - slide; }

function drawDivider() {
  const t = L.line * 1.4;
  ctx.fillStyle = PALETTE.divider;
  if (L.stacked) ctx.fillRect(0, L.zh - t / 2, W, t);
  else           ctx.fillRect(L.zw - t / 2, 0, t, H);
}

/** Крупный текст в стиле игры: белая заливка, чёрная обводка. */
function outlinedText(text, x, y, size, color) {
  ctx.font = 'bold ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
  setOutline(Math.max(4, Math.min(size * 0.10, 7)));
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || PALETTE.white;
  ctx.fillText(text, x, y);
}

function drawCountdown() {
  let label, frac, base;
  if (countdown > 0) {
    const t = countdown / CD_STEP_TIME;
    label = String(Math.ceil(t));
    frac  = t - Math.floor(t);           // 1 → 0 внутри одной цифры
    base  = Math.min(L.zw, L.zh) * 0.30;
  } else if (goFlash > 0) {
    label = 'РУБИ!';
    frac  = goFlash / GO_TIME;
    base  = Math.min(L.zw, L.zh) * 0.20;
  } else {
    return;
  }

  // По отсчёту в каждой зоне — верхний игрок читает свой в своей ориентации.
  for (const p of players) {
    withZone(p, () => {
      ctx.globalAlpha = 0.3 + frac * 0.7;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(label, L.zw / 2, L.zh * 0.5,
                   base * (1 + (1 - frac) * 0.3), PALETTE.accent);
      ctx.globalAlpha = 1;
    });
  }
}


/* ---------- Экраны меню ---------- */

/**
 * Дата самого файла игры (не сборки — сборки у нас нет). Показывается мелко в
 * меню: если браузер отдал старую копию из кэша, здесь будет старое время, и
 * не надо гадать, та ли это версия.
 */
const BUILD = (function () {
  const d = new Date(document.lastModified);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
})();

// Кнопки крупные: пальцем по ним попадают оба игрока, в том числе вслепую.
const BTN_MIN_H  = 60;        // px — минимальная высота кнопки
const BTN_MAX_H  = 84;
const BTN_GAP    = 16;

/**
 * Кнопка в стиле игры: скруглённый прямоугольник с чёрной обводкой.
 * dual — продублировать подпись вверх ногами: на экране-«стопке» верхний
 * игрок сидит с другой стороны телефона и иначе читать не может.
 */
function button(x, y, w, h, label, sub, action, hi, dual) {
  buttons.push({ x, y, w, h, action });
  roundRect(x, y, w, h, h * 0.28);
  fillStroke(hi ? PALETTE.btnHi : PALETTE.btn, Math.max(4, L.line));

  const size = Math.round(Math.min(w * 0.105, 25));
  const subSize = Math.round(Math.min(w * 0.062, 14));

  // Одна половина кнопки на игрока, если подпись двусторонняя.
  const face = (flip) => {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    if (flip) ctx.rotate(Math.PI);
    ctx.textAlign = 'center';
    const dy = dual ? h * 0.22 : 0;
    ctx.fillStyle = PALETTE.text;
    ctx.textBaseline = sub ? 'alphabetic' : 'middle';
    ctx.font = 'bold ' + size + 'px system-ui, -apple-system, sans-serif';
    ctx.fillText(label, 0, sub ? dy - h * 0.04 : dy);
    if (sub) {
      ctx.fillStyle = PALETTE.textDim;
      ctx.textBaseline = 'top';
      ctx.font = '500 ' + subSize + 'px system-ui, -apple-system, sans-serif';
      ctx.fillText(sub, 0, dy + h * 0.08);
    }
    ctx.restore();
  };

  face(false);
  if (dual) face(true);
}

function drawTitle(title, subtitle) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(title, W / 2, H * 0.20, Math.min(W * 0.13, H * 0.09, 64));
  if (subtitle) {
    ctx.fillStyle = PALETTE.textDim;
    ctx.font = '500 ' + Math.round(Math.min(W * 0.045, 20)) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillText(subtitle, W / 2, H * 0.20 + Math.min(W * 0.10, 52));
  }
}

/**
 * Экран загрузки: висит, пока не ответит SDK. Рисуется один кадр — игрового
 * цикла в это время ещё нет, поэтому анимации здесь и не может быть.
 */
function drawLoading() {
  drawBackground();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText('ЛЕСОРУБЫ', W / 2, H * 0.44, Math.min(W * 0.13, H * 0.09, 64));
  ctx.fillStyle = PALETTE.textDim;
  ctx.font = '500 ' + Math.round(Math.min(W * 0.045, 20)) +
             'px system-ui, -apple-system, sans-serif';
  ctx.fillText('загрузка…', W / 2, H * 0.44 + Math.min(W * 0.10, 52));
}

function drawMenu() {
  drawBackground();
  buttons = [];
  drawTitle('ЛЕСОРУБЫ', 'дуэль до ' + WIN_SCORE + ' очков');

  const bw = Math.min(W * 0.72, 420);
  const bh = Math.max(BTN_MIN_H, Math.min(H * 0.11, BTN_MAX_H));
  const x = (W - bw) / 2;
  let y = H * 0.42;
  button(x, y, bw, bh, 'Против бота', 'сложность: ' + diff.name,
         () => { scene = 'difficulty'; }, true);
  y += bh + BTN_GAP;
  button(x, y, bw, bh, 'На двоих',
         L.stacked ? 'один снизу, второй сверху' : 'один экран, два игрока',
         () => startGame('duo'), false);

  ctx.fillStyle = PALETTE.textDim;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '500 ' + Math.round(Math.min(W * 0.036, 15)) + 'px system-ui, -apple-system, sans-serif';
  // На ПК рубят клавишами: у левого игрока A / D, у правого стрелки. Мышь тоже
  // работает, поэтому про половины зоны говорим и там.
  const hints = DESKTOP
    ? ['Клавиши: A / D — левый игрок, \u2190 / \u2192 — правый',
       'Или мышью по левой и правой половине своей зоны',
       'Ветка с той же стороны — ошеломление']
    : ['Тапай по левой или правой половине своей зоны',
       'Ветка с той же стороны — ошеломление'];
  hints.forEach((t, i) => ctx.fillText(t, W / 2, H * 0.88 + i * 22));

  // Дата файла игры — мелко в углу. По ней сразу видно, не отдал ли браузер
  // старую копию из кэша: GitHub Pages разрешает держать её 10 минут.
  if (BUILD) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.font = '500 ' + Math.round(Math.min(W * 0.028, 12)) +
               'px system-ui, -apple-system, sans-serif';
    ctx.fillText('сборка ' + BUILD, W - 10, H - 8);
  }
}

function drawDifficulty() {
  drawBackground();
  buttons = [];
  drawTitle('Сложность', null);

  const bw = Math.min(W * 0.72, 420);
  const n  = DIFFICULTY.length;
  const bh = Math.max(BTN_MIN_H, Math.min(H * 0.11, BTN_MAX_H));
  const top = H * 0.30, bottom = H * 0.94;

  // Кнопки не мельче BTN_MIN_H: по ним попадают пальцем. Если в столбик они
  // не влезают (низкий экран, альбомная ориентация) — раскладываем в два.
  const rows = (cols) => Math.ceil(n / cols);
  const need = (cols) => rows(cols) * bh + rows(cols) * BTN_GAP + BTN_MIN_H;
  const cols = need(1) <= bottom - top ? 1 : 2;
  const cw = cols === 1 ? bw : (bw - BTN_GAP) / 2;

  const x0 = (W - bw) / 2;
  let y = top;
  DIFFICULTY.forEach((d, i) => {
    const col = i % cols, row = (i / cols) | 0;
    button(x0 + col * (cw + BTN_GAP), top + row * (bh + BTN_GAP), cw, bh,
           d.name, null, () => { diff = d; startGame('bot'); }, d.id === diff.id);
    y = top + (row + 1) * (bh + BTN_GAP);
  });
  button(x0, y, bw, BTN_MIN_H, 'Назад', null, () => { scene = 'menu'; }, false);
}

function drawGameOver() {
  // Позади — застывшее поле боя.
  drawBackground();
  for (const p of players) drawZone(p);
  drawDivider();

  ctx.fillStyle = 'rgba(20,18,16,0.55)';
  ctx.fillRect(0, 0, W, H);

  buttons = [];

  // Итог рисуем в каждой зоне: верхний игрок читает его не вверх ногами.
  const pulse = 1 + Math.sin(clock * 4) * 0.03;
  const big   = Math.round(Math.min(L.zw * 0.13, L.zh * 0.11, 56));
  for (const p of players) {
    const foe = players[p.index === 0 ? 1 : 0];
    withZone(p, () => {
      const cx = L.zw / 2, cy = L.zh * (L.stacked ? 0.40 : 0.26);
      const word = p === winner ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + big + 'px system-ui, -apple-system, sans-serif';
      // Длинное слово ужимаем, чтобы не упиралось в края зоны.
      const fit = Math.min(1, (L.zw * 0.82) / ctx.measureText(word).width);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse * fit, pulse * fit);
      outlinedText(word, 0, 0, big, p === winner ? PALETTE.accent : PALETTE.white);
      ctx.restore();

      // Счёт обоих, свой сверху — так каждый сразу видит собственный результат.
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(p.name + ' — ' + p.score, cx, cy + big * 0.95, big * 0.42,
                   p === winner ? PALETTE.accent : PALETTE.white);
      outlinedText(foe.name + ' — ' + foe.score, cx, cy + big * 1.55, big * 0.42,
                   foe === winner ? PALETTE.accent : PALETTE.white);
    });
  }

  // Кнопки — одни на двоих, по центру экрана, до них дотягиваются оба.
  // Подпись одна: двусторонняя надпись на кнопке читается хуже, чем обычная,
  // а что это за кнопки — понятно и с другой стороны телефона. Вверх ногами
  // дублируется только итог («ПОБЕДА» / «ПОРАЖЕНИЕ») — он и есть главное.
  const bw = Math.min(W * 0.66, 380);
  const bh = Math.max(BTN_MIN_H, Math.min(H * 0.10, BTN_MAX_H));
  const x  = (W - bw) / 2;
  let y = L.stacked ? H / 2 - bh - BTN_GAP / 2 : H * 0.56;
  // Реклама — ровно здесь, между забегами: рестарт и выход в меню. Сам забег
  // ничем не прерывается, а первый забег рекламы не видит (см. lastAdTime).
  button(x, y, bw, bh, 'Ещё раз', null,
         () => Yandex.showInterstitial(() => startGame(mode)), true);
  y += bh + BTN_GAP;
  button(x, y, bw, bh, 'В меню', null,
         () => Yandex.showInterstitial(() => { scene = 'menu'; }), false);
}

function render() {
  if (scene === 'loading')         { drawLoading(); return; }
  if (scene === 'menu')            { drawMenu(); return; }
  if (scene === 'difficulty')      { drawDifficulty(); return; }
  if (scene === 'over')            { drawGameOver(); return; }

  drawBackground();
  for (const p of players) drawZone(p);
  drawDivider();
  drawScoreBoard();
  drawCountdown();
}


/* =========================================================================
   11. ИГРОВОЙ ЦИКЛ — rAF + фиксированный шаг логики
   ========================================================================= */
let last = 0, acc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;          // вернулись из фона — не прокручиваем логику

  // Реклама или свёрнутая игра: логику не двигаем и долг не копим, на экране
  // остаётся последний кадр.
  if (Yandex.paused) { acc = 0; return; }

  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }

  render();
}

/*
 * Запуск. Игровой цикл стартует только после ответа SDK — до тех сидим на
 * статичном экране загрузки. Как только площадка на связи (или выяснилось,
 * что её нет), говорим LoadingAPI.ready() и показываем меню.
 */
resize();
drawLoading();
Yandex.init().then(() => {
  Yandex.loadingReady();
  scene = 'menu';
  last = 0;
  requestAnimationFrame(frame);
});
</script>
