name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

# Токену нужны права на публикацию Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны, но начатый не отменяем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Окружение github-pages пускает деплой только с ветки по умолчанию.
    # Пуш в любую другую ветку пропускаем заранее, чтобы ран не падал,
    # а не помечался красным. Когда веткой по умолчанию станет main,
    # публикация сама переедет на неё — правки workflow не нужны.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Включает Pages и переводит источник на GitHub Actions,
          # чтобы ничего не настраивать руками в Settings.
          enablement: true

      # Сборки нет: игра — статика, публикуем корень репозитория как есть.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
